  .page-wrap{width:100%;max-width:500px;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.5);animation:fadeUp .35s ease;}

  .pg{background:#F4F7F9;min-height:680px;padding-bottom:28px}

  .sec-hdr-txt{font-size:15px;font-weight:800;color:#fff}
  .sec-dot{width:10px;height:10px;border-radius:50%;background:#F5A623;flex-shrink:0}
  .sum-row{margin:0 20px 8px;background:rgba(255,255,255,0.1);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;direction:rtl}
  .sum-dot{width:8px;height:8px;border-radius:50%;background:#F5A623;flex-shrink:0}
  /* كسر عمودي */
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1}
  .frac .t{font-size:15px;font-weight:900;padding:0 4px;border-bottom:2.5px solid currentColor;line-height:1.4;text-align:center;min-width:16px}
  .frac .b{font-size:15px;font-weight:900;padding:0 4px;line-height:1.4;text-align:center;min-width:16px}
  .frac.sm .t,.frac.sm .b{font-size:12px}
  .frac.lg .t,.frac.lg .b{font-size:20px}
  /* عدد كسري: الصحيح يسار الكسر */
  .mixed{display:inline-flex;align-items:center;vertical-align:middle;gap:4px;direction:ltr}
  .mixed .whole{font-size:17px;font-weight:900}
  /* قاعدة */
  .rule-card{margin:0 20px 10px;border-radius:12px;padding:14px 16px}
  .rule-law{border-radius:8px;padding:10px 14px;text-align:center;font-size:14px;font-weight:800;margin:8px 0;line-height:2.2}
  .rule-ex{background:rgba(0,0,0,0.05);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;text-align:center;line-height:2.6}

  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden;border-radius:12px;margin:0 20px 10px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}

  .cmp-cell{padding:10px 12px;font-size:12px;line-height:2;text-align:center;font-weight:600}

  .q-opt{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:right;border:1.5px solid #E0E0E0;background:#F4F7F9;color:#1A2533;transition:all .2s}
  .q-opt.correct{background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;cursor:default}
  .q-opt.wrong{background:#FFEBEE;border-color:#C62828;color:#B71C1C;text-decoration:line-through;cursor:default}

  .show-btn{margin-top:8px;width:100%;padding:8px;background:#FFF8E7;border:1.5px dashed #F5A623;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;color:#E65100;cursor:pointer}

<body>

<script>
// كسر عمودي
function fr(t,b,c='#1565C0',sz=''){
  return `<span class="frac ${sz}" style="color:${c}"><span class="t">${t}</span><span class="b">${b}</span></span>`;
}
function frlg(t,b,c='#1565C0'){return fr(t,b,c,'lg');}

// عدد كسري: الصحيح على اليسار (الشرقي) - استخدام direction:ltr لأن الكسر يمين والصحيح يسار
function mx(whole,t,b,c='#1A2533',fc='#1565C0'){
  return `<span class="mixed"><span class="whole" style="color:${c}">${whole}</span>${fr(t,b,fc)}</span>`;
}

const QDATA=[
  {correct:2,explain:`البسط ٣ < المقام ٤ ← كسر اعتيادي ✓`},

  {correct:1,explain:`${mx('٣','٢','٥')} ← (٣×٥+٢)÷٥ = ${fr('١٧','٥')} ✓`},
  {correct:1,explain:`مقام مشترك ← ${fr('٢','٤')}+${fr('١','٤')}=${fr('٣','٤')} ✓`},
  {correct:2,explain:`(٣×٤)−(١×٦) = ١٢−٦=٦ | مقام=٢٤ | اختصر ÷٦ = ${fr('١','٤')} لا... (٣×٦−١×٤)/٢٤ = (١٨−٤)/٢٤ = ١٤/٢٤ = ${fr('٧','١٢')} ✓`},
  {correct:1,explain:`${fr('٢','٣')}×${fr('٩','٤')} ← اختصر ٢↔٤ (÷٢) و٩↔٣ (÷٣) = ${fr('١','١')}×${fr('٣','٢')} = ${fr('٣','٢')} ✓`},
  {correct:3,explain:`${fr('٣','٤')}÷${fr('٩','٨')} = ${fr('٣','٤')}×${fr('٨','٩')} ← اختصر ٨↔٤ (÷٤) و٣↔٩ (÷٣) = ${fr('١','١')}×${fr('٢','٣')} = ${fr('٢','٣')} ✓`},
  {correct:1,explain:`٣×٧=٢١ | ٤×٥=٢٠ | ٢١>٢٠ ← ${fr('٣','٤')} أكبر ✓`},
  {correct:2,explain:`${fr('٣','٤')} = ٠٫٧٥ | ٠٫٧٥×١٠٠ = ٧٥٪ ✓`},
  {correct:1,explain:`الطالب حل ٣/٤ من ٤٨ سؤالاً = ٣×٤٨÷٤ = ١٤٤÷٤ = ٣٦ سؤالاً ✓`},
];

function revealQ(qi){
  const{correct,explain}=QDATA[qi];
  document.querySelectorAll(`#q${qi}opts .q-opt`).forEach((o,i)=>{
    o.classList.add(i===correct?'correct':'wrong');
    o.onclick=null;
  });
  const exp=document.getElementById(`q${qi}exp`);
  exp.innerHTML='💡 '+explain;
  exp.style.display='block';
  const btn=document.getElementById(`q${qi}btn`);
  if(btn)btn.style.display='none';
}
function pickQ(qi){revealQ(qi)}

function initExplains(){
  QDATA.forEach((q,qi)=>{
    const el=document.getElementById('q'+qi+'exp');
    if(el) el.innerHTML='💡 '+q.explain;
  });
}
let current=0;
function render(){
  const p=PAGES[current];
  const wrap=document.getElementById('pageWrap');
  wrap.innerHTML=p.html+`<div class="page-num-bar" style="background:${p.bg}">${current+1}</div>`;
  wrap.style.animation='none';wrap.offsetHeight;wrap.style.animation='fadeUp .35s ease';
  document.getElementById('navLabel').textContent=p.label+'  '+(current+1)+'/'+PAGES.length;
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=current===PAGES.length-1;
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'');
    d.style.width=i===current?'24px':'8px';
    d.onclick=()=>{current=i;render()};
    dots.appendChild(d);
  });
  initExplains();
}
function changePage(dir){current=Math.max(0,Math.min(PAGES.length-1,current+dir));render();}
render();
</script>
