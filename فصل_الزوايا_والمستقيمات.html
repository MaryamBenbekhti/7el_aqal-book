  {correct:0, explain:'الزوايا المتبادلة (مع المتوازيات) متساوية = ٥٥° ✓'},
];
function revealQ(qi){
  const{correct,explain}=QDATA[qi];
  document.querySelectorAll(`#q${qi}opts .q-opt`).forEach((o,i)=>{
    o.classList.add(i===correct?'correct':'wrong'); o.onclick=null;
  });
  const exp=document.getElementById(`q${qi}exp`);
  exp.innerHTML='💡 '+explain; exp.style.display='block';
  const btn=document.getElementById(`q${qi}btn`); if(btn)btn.style.display='none';
}
function pickQ(qi){revealQ(qi)}

// دالة لرسم قوس بنقاط دقيقة
function arc(cx,cy,r,a1,a2,steps=30){
  let pts=[];
  for(let i=0;i<=steps;i++){
    let t=a1+(a2-a1)*i/steps, rad=t*Math.PI/180;
    pts.push(`${(cx+r*Math.cos(rad)).toFixed(1)},${(cy-r*Math.sin(rad)).toFixed(1)}`);
  }
  return 'M'+pts[0]+' '+pts.slice(1).map(p=>'L'+p).join(' ');
}

        <text x="${cx+rt}" y="${cy+4}" font-size="10" fill="#C62828" font-weight="bold" text-anchor="middle">50</text>
        <text x="${cx-rt}" y="${cy+4}" font-size="10" fill="#C62828" font-weight="bold" text-anchor="middle">50</text>
        <text x="${cx}" y="${cy-rt+4}" font-size="10" fill="#1565C0" font-weight="bold" text-anchor="middle">130</text>
        <text x="${cx}" y="${cy+rt+12}" font-size="10" fill="#1565C0" font-weight="bold" text-anchor="middle">130</text>`;

`},

function initExplains(){
  QDATA.forEach((q,qi)=>{
    const el=document.getElementById('q'+qi+'exp');
    if(el) el.innerHTML='💡 '+q.explain;
  });
}
let current=0;
function render(){
  const p=PAGES[current];
  const wrap=document.getElementById('pageWrap');
  wrap.innerHTML=p.html+`<div class="page-num-bar" style="background:${p.bg}">${current+1}</div>`;
  wrap.style.animation='none';wrap.offsetHeight;wrap.style.animation='fadeUp .35s ease';
  document.getElementById('navLabel').textContent=p.label+'  '+(current+1)+'/'+PAGES.length;
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=current===PAGES.length-1;
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'');
    d.style.width=i===current?'24px':'8px';
    d.onclick=()=>{current=i;render()};
    dots.appendChild(d);
  });
  initExplains();
}
function changePage(dir){current=Math.max(0,Math.min(PAGES.length-1,current+dir));render();}
render();
</script>
