<script>
function fr(t,b,c='#7B2D8B'){
  return `<span class="frac" style="color:${c}"><span class="t">${t}</span><span class="b">${b}</span></span>`;
}
function pw(base,exp,bc='#1A2533',ec='#E8512B'){
  return `<span style="display:inline-flex;align-items:flex-start;vertical-align:middle"><span style="font-size:16px;font-weight:900;color:${bc}">${base}</span><span style="font-size:10px;font-weight:900;vertical-align:super;color:${ec}">${exp}</span></span>`;
}

  {correct:3, explain:`(٥+٣)² = ٥² + ٢×٥×٣ + ٣² = ٢٥+٣٠+٩ = ٦٤ ✓`},
  {correct:1, explain:`١٠٢ × ٩٨ = (١٠٠+٢)(١٠٠−٢) = ١٠٠٠٠−٤ = ٩٩٩٦ ✓`},
  {correct:2, explain:`٣س+٤=٢٥ | ٣س=٢١ | س=٧ ✓`},
  {correct:0, explain:`س+ص=١٠ وس−ص=٤ | نجمع: ٢س=١٤ | س=٧ | ص=٣ | س×ص=٢١ ✓`},
  {correct:3, explain:`٢س−٣>٧ | ٢س>١٠ | س>٥ ✓`},
  {correct:1, explain:`${pw('س','٢')}−٥س+٦=٠ | (س−٢)(س−٣)=٠ | س=٢ أو س=٣ ✓`},
  {correct:2, explain:`الكبير=س | الصغير=س−٦ | س+(س−٦)=٤٠ | ٢س=٤٦ | س=٢٣ ✓`},
  {correct:0, explain:`العدد=س | س+${fr('س','٢')}+${fr('س','٣')}=${fr('٦س+٣س+٢س','٦')}=${fr('١١س','٦')}=٣٠ | ١١س=١٨٠ | س≈١٦٫٤ قريب من الخيار الصحيح: ٣٦ ← ٣٦/٢=١٨، ٣٦/٣=١٢ → ٣٦+١٨+١٢=٦٦≠٣٠... الصحيح: نصفه+ثلثه=${fr('٥','٦')}س=٣٠ | س=٣٦ ✓`},
];

function revealQ(qi){
  const{correct,explain}=QDATA[qi];
  document.querySelectorAll(`#q${qi}opts .q-opt`).forEach((o,i)=>{
    o.classList.add(i===correct?'correct':'wrong');
    o.onclick=null;
  });
  const exp=document.getElementById(`q${qi}exp`);
  exp.innerHTML='💡 '+explain;
  exp.style.display='block';
  const btn=document.getElementById(`q${qi}btn`);
  if(btn)btn.style.display='none';
}
function pickQ(qi){revealQ(qi)}

function initExplains(){
  QDATA.forEach((q,qi)=>{
    const el=document.getElementById('q'+qi+'exp');
    if(el) el.innerHTML='💡 '+q.explain;
  });
}
let current=0;
function render(){
  const p=PAGES[current];
  const wrap=document.getElementById('pageWrap');
  wrap.innerHTML=p.html+`<div class="page-num-bar" style="background:${p.bg}">${current+1}</div>`;
  wrap.style.animation='none';wrap.offsetHeight;wrap.style.animation='fadeUp .35s ease';
  document.getElementById('navLabel').textContent=p.label+'  '+(current+1)+'/'+PAGES.length;
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=current===PAGES.length-1;
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'');
    d.style.width=i===current?'24px':'8px';
    d.onclick=()=>{current=i;render()};
    dots.appendChild(d);
  });
  initExplains();
}
function changePage(dir){current=Math.max(0,Math.min(PAGES.length-1,current+dir));render();}
render();
</script>
