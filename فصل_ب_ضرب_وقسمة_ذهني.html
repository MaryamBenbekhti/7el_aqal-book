  .nav-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:500px;padding:10px 16px;background:rgba(255,255,255,0.08);border-radius:50px;}
  .nav-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:600;padding:6px 16px;border-radius:20px;cursor:pointer;}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .nav-label{color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;text-align:center}
  .page-wrap{width:100%;max-width:500px;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.5);animation:fadeUp .35s ease;}
  .page-num-bar{text-align:center;padding:8px;font-size:11px;color:#7B8FA1;font-family:'Tajawal',sans-serif;}
  .dots{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center;max-width:500px}
  .dot{height:8px;border-radius:4px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,0.25)}
  .dot.active{width:24px!important;background:#F5A623}
  .pw{background:#fff;min-height:680px;padding-bottom:28px}
  .pg{background:#F4F7F9;min-height:680px;padding-bottom:28px}
  .sec-hdr{margin:24px 20px 16px;border-radius:10px;padding:14px 20px;display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .sec-hdr-txt{font-size:15px;font-weight:800;color:#fff}
  .sec-dot{width:10px;height:10px;border-radius:50%;background:#F5A623;flex-shrink:0}
  .cmp{margin:0 20px 10px;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
  .cmp-head{display:grid;grid-template-columns:1fr 1fr}
  .cmp-hd{padding:10px 14px;font-size:12px;font-weight:800;color:#fff;text-align:center}
  .cmp-row{display:grid;grid-template-columns:1fr 1fr}
  .cmp-cell{padding:10px 12px;font-size:12px;line-height:1.9;text-align:center;font-weight:500}
  .note-box{margin:0 20px;border-radius:10px;padding:12px 16px;text-align:center}
  .trick-box{margin:0 20px 12px;background:#0D4F5C;border-radius:12px;padding:16px 18px}
  .trick-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;direction:rtl}
  .trick-num{width:22px;height:22px;border-radius:50%;background:#F5A623;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#0D4F5C;flex-shrink:0;margin-top:2px}
  .trick-text{font-size:12px;color:#E0F7FA;line-height:1.8;flex:1;text-align:right}
  .ex-card{margin:0 20px 10px;background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
  .sum-row{margin:0 20px 8px;background:rgba(255,255,255,0.1);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;direction:rtl}
  .sum-dot{width:8px;height:8px;border-radius:50%;background:#F5A623;flex-shrink:0}

  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1}
  .frac .top{font-size:14px;font-weight:800;padding:0 3px;border-bottom:2px solid currentColor;line-height:1.3}
  .frac .bot{font-size:14px;font-weight:800;padding:0 3px;line-height:1.3}

let current=0;
function render(){
  const p=PAGES[current];
  const wrap=document.getElementById('pageWrap');
  wrap.innerHTML=p.html+`<div class="page-num-bar" style="background:${p.bg}">${current+1}</div>`;
  wrap.style.animation='none';wrap.offsetHeight;wrap.style.animation='fadeUp .35s ease';
  document.getElementById('navLabel').textContent=p.label+'  '+(current+1)+'/'+PAGES.length;
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=current===PAGES.length-1;
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'');
    d.style.width=i===current?'24px':'8px';
    d.onclick=()=>{current=i;render()};
    dots.appendChild(d);
  });
}
function changePage(dir){current=Math.max(0,Math.min(PAGES.length-1,current+dir));render();}
render();
</script>
