<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e2a38;font-family:'Tajawal',sans-serif;direction:rtl;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px;gap:8px}

.nb{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:500px;padding:10px 16px;background:rgba(255,255,255,0.08);border-radius:50px}

.nb span{color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;text-align:center}

.qt{font-size:13px;font-weight:700;color:#1A2533;margin-bottom:10px;line-height:2}
.qo{display:flex;flex-direction:column;gap:6px}
.op{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:right;border:1.5px solid #E0E0E0;background:#F4F7F9;color:#1A2533;transition:all .2s}
.op.ok{background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;cursor:default}
.op.no{background:#FFEBEE;border-color:#C62828;color:#B71C1C;text-decoration:line-through;cursor:default}
.qe{background:#E8F5E9;border-radius:8px;padding:9px 13px;margin-top:7px;font-size:12px;color:#1B5E20;line-height:2;display:none}
.sb{margin-top:7px;width:100%;padding:8px;background:#E8EAF6;border:1.5px dashed #3949AB;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;color:#3949AB;cursor:pointer}

function rv(qi){
  let d=QD[qi];
  document.querySelectorAll('#qo'+qi+' .op').forEach((o,i)=>{
    o.classList.add(i===d.c?'ok':'no');o.onclick=null;
  });
  let e=document.getElementById('qe'+qi);
  e.innerHTML='💡 '+d.e;e.style.display='block';

}
const PAGES=[{'l': 'الغلاف', 'b': '#0D1B4F', 'h': '<div style="background:linear-gradient(160deg,#0D1B4F,#1A237E);min-height:680px;display:flex;flex-direction:column">\n  <div style="background:linear-gradient(to left,#F5A623,#E8940A);padding:11px 20px;font-size:11px;font-weight:700;color:#0D1B4F;display:flex;justify-content:space-between">\n    <span>فكِّر أقل … حُلَّ أسرع</span><span>الهندسة — الفصل الثالث</span>\n  </div>\n  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px">\n    <svg width="200" height="130" viewBox="0 0 200 130" style="margin-bottom:14px">\n      <rect x="10" y="10" width="50" height="50" fill="rgba(245,166,35,0.15)" stroke="#F5A623" stroke-width="2"/>\n      <rect x="75" y="10" width="70" height="45" fill="rgba(245,166,35,0.1)" stroke="#F5A623" stroke-width="2"/>\n      <polygon points="155,55 165,10 195,10 185,55" fill="rgba(245,166,35,0.1)" stroke="#F5A623" stroke-width="2"/>\n      <polygon points="10,80 10,120 60,120 80,80" fill="rgba(245,166,35,0.08)" stroke="#F5A623" stroke-width="2"/>\n      <polygon points="90,80 90,120 160,120 140,80" fill="rgba(245,166,35,0.08)" stroke="#F5A623" stroke-width="2"/>\n    </svg>\n    <div style="font-family:serif;font-size:34px;color:#fff;font-weight:700;text-align:center">المضلعات الرباعية</div>\n    <div style="width:50%;height:2px;background:linear-gradient(to left,transparent,#F5A623,transparent);margin:16px auto"></div>\n    <div style="font-size:12.5px;color:rgba(197,202,233,0.9);text-align:center;line-height:2">مربع — مستطيل — معين<br/><strong style="color:#F5A623">متوازي أضلاع — شبه منحرف</strong></div>\n    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px"><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">المربع</div><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(9      <div style="padding:8px;font-size:11px;font-weight:800;color:#fff;text-align:center">عدد الأضلاع</div>\n      <div style="padding:8px;font-size:11px;font-weight:800;color:#fff;text-align:center">المضلع</div>\n    </div>\n    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff"><div style="padding:8px;font-size:12px;font-weight:900;color:#E8512B;text-align:center">١٨٠°</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A2533">٣</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A237E">مثلث</div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:#F4F7F9"><div style="padding:8px;font-size:12px;font-weight:900;color:#E8512B;text-align:center">٣٦٠°</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A2533">٤</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A237E">رباعي</div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff"><div style="padding:8px;font-size:12px;font-weight:900;color:#E8512B;text-align:center">٥٤٠°</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A2533">٥</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A237E">خماسي</div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:#F4F7F9"><div style="padding:8px;font-size:12px;font-weight:900;color:#E8512B;text-align:center">٧٢٠°</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A2533">٦</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A237E">سداسي</div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff"><div style="padding:8px;font-size:12px;font-weight:900;color:#E8512B;text-align:center">١٠٨٠°</div><div style="padding:8px;font-size:12px;font-weight:700;text-align:center;color:#1A2533">٨</div \n        <rect x="15" y="15" width="90" height="90" fill="rgba(230,81,0,0.08)" stroke="#E65100" stroke-width="2.5"/>\n        <rect x="15" y="15" width="15" height="15" fill="none" stroke="#E65100" stroke-width="1.5"/>\n        <rect x="90" y="15" width="15" height="15" fill="none" stroke="#E65100" stroke-width="1.5" transform="rotate(90,97.5,22.5)"/>\n        <rect x="15" y="90" width="15" height="15" fill="none" stroke="#E65100" stroke-width="1.5" transform="rotate(-90,22.5,97.5)"/>\n        <rect x="90" y="90" width="15" height="15" fill="none" stroke="#E65100" stroke-width="1.5" transform="rotate(180,97.5,97.5)"/>\n        <line x1="52" y1="15" x2="58" y2="15" stroke="#E65100" stroke-width="2"/>\n        <line x1="52" y1="105" x2="58" y2="105" stroke="#E65100" stroke-width="2"/>\n        <line x1="15" y1="52" x2="15" y2="58" stroke="#E65100" stroke-width="2"/>\n        <line x1="105" y1="52" x2="105" y2="58" stroke="#E65100" stroke-width="2"/>\n        <line x1="15" y1="15" x2="105" y2="105" stroke="#C62828" stroke-width="1.8" stroke-dasharray="4,3"/>\n        <text x="60" y="13" font-size="11" fill="#E65100" font-weight="bold" text-anchor="middle">ض</text>\n        <text x="112" y="62" font-size="11" fill="#E65100" font-weight="bold" text-anchor="middle">ض</text>\n        <text x="68" y="56" font-size="10" fill="#C62828" font-weight="bold" transform="rotate(45,68,56)">ض<span style="display:inline-block;transform:scaleX(-1)">√</span>٢</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        <div style="font-size:13px;font-weight:800;color:#E65100;margin-bottom:6px">القوانين</div>\n        المحيط = <strong style="color:#E65100">٤ × ض</strong><br/>\n        المساحة = <strong style="color:#E65100">ض²</strong><br/>\n        القطر = <strong style="color:#C62828">ض × <span style="display:inline-block;transform:scaleX(-1)">√</span>٢</strong><br/>\n        الزوايا = <strong style="color:#E65100">٩٠° جميعها</strong>\n      </div>\n    </div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#1565C0;margin-bottom:8px">أمثلة سريعة</div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">\n      مربع ضلعه ٦ سم — ما مساحته؟<br/>م = ٦² = <strong style="color:#E8512B">٣٦ سم² ✓</strong>\n    </div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">\n      مربع مساحته ٤٩ — ما ضلعه؟<br/>ض = <span style="display:inline-block;transform:scaleX(-1)">√</span>٤٩ = <strong style="color:#E8512B">٧ سم ✓</strong>\n    </div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;font-size:12px;color:#1A2533;line-height:2">\n      مربع ضلعه ٥ — ما قطره؟<br/>قطر = ٥ × <span style="display:inline-block;transform:scaleX(-1)">√</span>٢ = <strong style="color:#E8512B">٥<span style="display:inline-block;transform:scaleX(-1)">√</span>٢ ✓</strong>\n    </div>\n  </div>\n  <div style="margin:0 20px;background:#FFF8E7;border:2px solid #F5A623;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;color:#7A4800">\n    💡 قطرا المربع متساويان ويتعامدان في المنتصف\n  </div>\n</div>'}, {'l': 'المستطيل', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#1565C0"><span>المستطيل</span><div class="sd"></div></div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="display:flex;align-items:center;gap:16px">\n      <svg width="140" height="100" viewBox="0 0 140 100">\n        <rect x="10" y="15" width="120" height="70" fill="rgba(21,101,192,0.08)" stroke="#1565C0" stroke-width="2.5"/>\n        <rect x="10" y="15" width="14" height="14" fill="none" stroke="#1565C0" stroke-width="1.5"/>\n        <rect x="116" y="15" width="14" height="14" fill="none" stroke=" let cur=0;
function render(){
  let p=PAGES[cur];
  let w=document.getElementById('pw');
  w.innerHTML=p.h+'<div class="pnb" style="background:'+p.b+'">'+(cur+1)+'</div>';
  w.style.animation='none';w.offsetHeight;w.style.animation='fadeUp .35s ease';
  document.getElementById('nl').textContent=p.l+'  '+(cur+1)+'/'+PAGES.length;
  document.getElementById('bp').disabled=cur===0;
  document.getElementById('bn').disabled=cur===PAGES.length-1;
  let dt=document.getElementById('dots');dt.innerHTML='';
  PAGES.forEach((_,i)=>{
    let d=document.createElement('div');
    d.className='dot'+(i===cur?' active':'');
    d.style.width=i===cur?'24px':'8px';
    d.onclick=()=>{cur=i;render();};
    dt.appendChild(d);
  });
}
function cp(dir){cur=Math.max(0,Math.min(PAGES.length-1,cur+dir));render();}
