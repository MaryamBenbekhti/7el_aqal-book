<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e2a38;font-family:'Tajawal',sans-serif;direction:rtl;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px;gap:8px}

.nb{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:500px;padding:10px 16px;background:rgba(255,255,255,0.08);border-radius:50px}

.nb button:disabled{opacity:.3;cursor:default}
.nb span{color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;text-align:center}
.pw{width:100%;max-width:500px;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.5);animation:fadeUp .35s ease}
.pnb{text-align:center;padding:8px;font-size:11px;color:#7B8FA1}
.dots{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center;max-width:500px}
.dot{height:8px;border-radius:4px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,0.25)}
.dot.active{width:24px!important;background:#F5A623}
.sh{margin:20px 20px 11px;border-radius:10px;padding:12px 17px;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.sh span{font-size:15px;font-weight:800;color:#fff}
.sd{width:10px;height:10px;border-radius:50%;background:#F5A623;flex-shrink:0}
.ex{margin:0 20px 8px;border-radius:12px;padding:12px 14px}
.qc{margin:0 20px 8px;border-radius:12px;padding:12px 14px;border:2px solid #EDE7F6;background:#FDFBFF}
.qt{font-size:13px;font-weight:700;color:#1A2533;margin-bottom:9px;line-height:2}
.qo{display:flex;flex-direction:column;gap:5px}
.op{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:right;border:1.5px solid #E0E0E0;background:#F4F7F9;color:#1A2533;transition:all .2s}
.op.ok{background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;cursor:default}
.op.no{background:#FFEBEE;border-color:#C62828;color:#B71C1C;text-decoration:line-through;cursor:default}
.qe{background:#E8F5E9;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:12px;color:#1B5E20;line-height:2;display:none}
.sb{margin-top:6px;width:100%;padding:7px;background:#EDE7F6;border:1.5px dashed #7B2D8B;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;color:#6A1B9A;cursor:pointer}
.sr{margin:0 20px 7px;background:rgba(255,255,255,0.1);border-radius:10px;padding:11px 15px;display:flex;align-items:center;gap:10px}
svg text{font-family:'Tajawal',sans-serif}
</style>
</head>

<script>
const QD=[{c:2,e:'مكعب ض=٤: ح=٤³=٦٤ ✓'},{c:0,e:'م.مستطيلات ٣×٥×٢: ح=٣×٥×٢=٣٠ ✓'},{c:3,e:'أسطوانة نق=٣،ار=١٠: ح=ط×٩×١٠=٩٠ط ✓'},{c:1,e:'مخروط نق=٣،ار=١٠: ح=<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٣</span></span>×ط×٩×١٠=٣٠ط ✓'},{c:2,e:'كرة نق=٣: ح=<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">٤</span><span style="font-size:13px;font-weight:900;padding:0 3px">٣</span></span>×ط×٢٧=٣٦ط ✓'},{c:0,e:'مكعب ض=٥: م.كلية=٦×٢٥=١٥٠ ✓'},{c:3,e:'ضاعف كل الأبعاد: ك=٢ → ح×٢³=ح×٨ ✓'},{c:1,e:'١م³=١٠٠٠٠٠٠ سم³ ✓'},{c:2,e:'أسطوانة نق=٢،ار=٥: م.جانبية=٢×ط×٢×٥=٢٠ط ✓'},{c:0,e:'مكعب ح=١٢٥: ض=⁴√... لا! ض={RT}٣(١٢٥)=٥ ✓'},];
function rv(qi){
  let d=QD[qi];
  document.querySelectorAll('#qo'+qi+' .op').forEach((o,i)=>{
    o.classList.add(i===d.c?'ok':'no');o.onclick=null;
  });
  let e=document.getElementById('qe'+qi);
  e.innerHTML='💡 '+d.e;e.style.display='block';
  let b=document.getElementById('qb'+qi);if(b)b.style.display='none';
}
const PAGES=[{'l': 'الغلاف', 'b': '#1A237E', 'h': '<div style="background:linear-gradient(160deg,#1A237E,#283593);min-height:680px;display:flex;flex-direction:column">\n  <div style="background:linear-gradient(to left,#F5A623,#E8940A);padding:11px 20px;font-size:11px;font-weight:700;color:#1A237E;display:flex;justify-content:space-between">\n    <span>فكِّر أقل … حُلَّ أسرع</span><span>الهندسة — الفصل السادس</span>\n  </div>\n  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px">\n    <svg width="200" height="130" viewBox="0 0 200 130" style="margin-bottom:14px">\n      <!-- مكعب -->\n      <polygon points="20,90 20,40 60,40 60,90" fill="rgba(245,166,35,0.15)" stroke="#F5A623" stroke-width="2"/>\n      <polygon points="20,40 50,15 90,15 60,40" fill="rgba(245,166,35,0.1)" stroke="#F5A623" stroke-width="2"/>\n      <polygon points="60,40 90,15 90,65 60,90" fill="rgba(245,166,35,0.08)" stroke="#F5A623" stroke-width="2"/>\n      <!-- أسطوانة -->\n      <ellipse cx="148" cy="105" rx="32" ry="10" fill="rgba(245,166,35,0.12)" stroke="#F5A623" stroke-width="1.8"/>\n      <rect x="116" y="35" width="64" height="70" fill="rgba(245,166,35,0.1)" stroke="none"/>\n      <line x1="116" y1="35" x2="116" y2="105" stroke="#F5A623" stroke-width="1.8"/>\n      <line x1="180" y1="35" x2="180" y2="105" stroke="#F5A623" stroke-width="1.8"/>\n      <ellipse cx="148" cy="35" rx="32" ry="10" fill="rgba(245,166,35,0.15)" stroke="#F5A623" stroke-width="1.8"/>\n    </svg>\n    <div style="font-family:serif;font-size:34px;color:#fff;font-weight:700;text-align:center">الحجوم</div>\n    <div style="width:50%;height:2px;background:linear-gradient(to left,transparent,#F5A623,transparent);margin:16px auto"></div>\n    <div style="font-size:12.5px;color:rgba(197,202,233,0.9);text-align:center;line-height:2">مكعب — متوازي مستطيلات<br/><strong style="color:#F5A623">أسطوانة — مخروط — كرة</strong></div>\n    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px"><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">المكعب</div><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">متوازي المستطيلات</div><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">الأسطوانة</div><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">المخروط</div><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">الكرة</div><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">وحدات الحجم</div><div style="background:rgba(26,35,126,0.3);border:1px solid rgba(92,107,192,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#9FA8DA;font-weight:600">نسبة التغير</div>\n    </div>\n  </div>\n  <div style="background:rgba(0,0,0,0.25);padding:10px 20px;display:flex;justify-content:space-between">\n    <span style="font-size:10px;color:rgba(159,168,218,0.5)">الهندسة والقياس</span>\n    <span style="font-size:11px;font-weight:700;color:#F5A623">اختبار القدرات العامة</span>\n  </div>\n</div>'}, {'l': '⚠️ فخ الوحدات', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#C62828"><span>⚠️ فخ الوحدات — انتبه دائماً!</span><div class="sd"></div></div>\n  <div class="ex" style="background:#FFEBEE">\n    <div style="font-size:13px;font-weight:800;color:#C62828;margin-bottom:8px">المساحة ≠ الحجم!</div>\n    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">\n      <div style="background:rgba(255,255,255,0.7);border-radius:8px;padding:10px"><div style="font-size:18px">📏</div><div style="font-size:12px;font-weight:800;color:#1565C0;margin-top:4px">سم</div><div style="font-size:11px;color:#7B8FA1">طول</div></div><div style="background:rgba(255,255,255,0.7);border-radius:8px;padding:10px"><div style="font-size:18px">📐</div><div style="font-size:12px;font-weight:800;color:#2E7D32;margin-top:4px">سم²</div><div style="font-size:11px;color:#7B8FA1">مساحة</div></div><div style="background:rgba(255,255,255,0.7);border-radius:8px;padding:10px"><div style="font-size:18px">📦</div><div style="font-size:12px;font-weight:800;color:#7B2D8B;margin-top:4px">سم³</div><div style="font-size:11px;color:#7B8FA1">حجم</div></div>\n    </div>\n  </div>\n  <div class="ex" style="background:#FBE9E7">\n    <div style="font-size:13px;font-weight:800;color:#BF360C;margin-bottom:8px">تحويل وحدات الحجم</div>\n    <div style="background:#0D4F5C;border-radius:8px;padding:10px;text-align:center;margin-bottom:8px">\n      <div style="font-size:13px;font-weight:900;color:#F5A623">١م³ = ١٠٠٠٠٠٠ سم³</div>\n      <div style="font-size:11px;color:#B2EBF2;margin-top:3px">لأن ١٠٠×١٠٠×١٠٠ = ١٠٠٠٠٠٠</div>\n    </div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:7px 11px;margin-bottom:5px;font-size:12px;color:#1A2533;line-height:2">١م³ = <strong style="color:#C62828">١,٠٠٠,٠٠٠ سم³</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:7px 11px;margin-bottom:5px;font-size:12px;color:#1A2533;line-height:2">١ لتر = ١٠٠٠ سم³</div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:7px 11px;margin-bottom:5px;font-size:12px;color:#1A2533;line-height:2">١ م³ = ١٠٠٠ لتر</div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:7px 11px;margin-bottom:5px;font-size:12px;color:#1A2533;line-height:2"><strong style="color:#C62828">٥٠٠٠ سم³ = ٥ لتر</strong></div>\n  </div>\n  <div class="ex" style="background:#FFF8E7;border:2px solid #F5A623;border-radius:12px">\n    <div style="font-size:13px;font-weight:800;color:#7A4800;margin-bottom:6px">القاعدة الذهبية</div>\n    <div style="font-size:12px;color:#9B6000;line-height:2">\n      الجواب بـ <strong style="color:#7B2D8B">سم³</strong> إذا الأبعاد بالسم<br/>\n      الجواب بـ <strong style="color:#1565C0">م³</strong> إذا الأبعاد بالمتر<br/>\n      <strong style="color:#C62828">لا تخلط الوحدات أبداً!</strong>\n    </div>\n  </div>\n</div>'}, {'l': 'المكعب ومتوازي المستطيلات', 'b': '#F4F7F9', 'h': '<div style="background:#F4F7F9;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#E65100"><span>المكعب ومتوازي المستطيلات</span><div class="sd"></div></div>\n  <div class="ex" style="background:#FBE9E7">\n    <div style="font-size:13px;font-weight:800;color:#E65100;margin-bottom:8px">المكعب — كل الأبعاد متساوية</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="105" height="95" viewBox="0 0 105 95">\n        <polygon points="5,75 5,25 45,25 45,75" fill="rgba(230,81,0,0.1)" stroke="#E65100" stroke-width="2"/>\n        <polygon points="5,25 30,5 70,5 45,25" fill="rgba(230,81,0,0.08)" stroke="#E65100" stroke-width="2"/>\n        <polygon points="45,25 70,5 70,55 45,75" fill="rgba(230,81,0,0.06)" stroke="#E65100" stroke-width="2"/>\n        <line x1="5" y1="75" x2="30" y2="55" stroke="#E65100" stroke-width="1.5" stroke-dasharray="3,2"/>\n        <line x1="30" y1="5" x2="30" y2="55" stroke="#E65100" stroke-width="1.5" stroke-dasharray="3,2"/>\n        <line x1="30" y1="55" x2="70" y2="55" stroke="#E65100" stroke-width="1.5" stroke-dasharray="3,2"/>\n        <text x="25" y="52" font-size="11" fill="#E65100" font-weight="bold">ض</text>\n        <text x="55" y="35" font-size="11" fill="#E65100" font-weight="bold">ض</text>\n        <text x="48" y="78" font-size="11" fill="#E65100" font-weight="bold">ض</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        <div style="font-size:13px;font-weight:800;color:#E65100;margin-bottom:5px">القوانين</div>\n        الحجم = <strong style="color:#E65100">ض × ض × ض = ض³</strong><br/>\n        م.ج.كلية = <strong style="color:#E65100">٦ × ض²</strong><br/>\n        م.ج.جانبية = <strong style="color:#E65100">٤ × ض²</strong>\n      </div>\n    </div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-top:7px;font-size:12px;color:#1A2533;line-height:2">\n      مكعب ضلعه ٤ → ح = ٤³ = <strong style="color:#E8512B">٦٤ سم³ ✓</strong>\n    </div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#1565C0;margin-bottom:8px">متوازي المستطيلات</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="115" height="85" viewBox="0 0 115 85">\n        <polygon points="5,68 5,28 55,28 55,68" fill="rgba(21,101,192,0.1)" stroke="#1565C0" stroke-width="2"/>\n        <polygon points="5,28 28,8 78,8 55,28" fill="rgba(21,101,192,0.08)" stroke="#1565C0" stroke-width="2"/>\n        <polygon points="55,28 78,8 78,48 55,68" fill="rgba(21,101,192,0.06)" stroke="#1565C0" stroke-width="2"/>\n        <line x1="5" y1="68" x2="28" y2="48" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="3,2"/>\n        <line x1="28" y1="8" x2="28" y2="48" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="3,2"/>\n        <line x1="28" y1="48" x2="78" y2="48" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="3,2"/>\n        <text x="30" y="50" font-size="10" fill="#E65100" font-weight="bold">ط</text>\n        <text x="60" y="30" font-size="10" fill="#2E7D32" font-weight="bold">ع</text>\n        <text x="33" y="75" font-size="10" fill="#7B2D8B" font-weight="bold">ار</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        الحجم = <strong style="color:#1565C0">ط × ع × ار</strong><br/>\n        م.ج.كلية = <strong style="color:#1565C0">٢(طع+طار+عار)</strong>\n      </div>\n    </div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-top:7px;font-size:12px;color:#1A2533;line-height:2">\n      أبعاده ٣×٥×٢ → ح = ٣×٥×٢ = <strong style="color:#E8512B">٣٠ سم³ ✓</strong>\n    </div>\n  </div>\n</div>'}, {'l': 'الأسطوانة والمخروط والكرة', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#7B2D8B"><span>الأسطوانة والمخروط والكرة</span><div class="sd"></div></div>\n  <div class="ex" style="background:#F3E5F5">\n    <div style="font-size:13px;font-weight:800;color:#7B2D8B;margin-bottom:7px">الأسطوانة</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="85" height="100" viewBox="0 0 85 100">\n        <ellipse cx="42" cy="88" rx="36" ry="11" fill="rgba(123,45,139,0.12)" stroke="#7B2D8B" stroke-width="2"/>\n        <rect x="6" y="20" width="72" height="68" fill="rgba(123,45,139,0.08)" stroke="none"/>\n        <line x1="6" y1="20" x2="6" y2="88" stroke="#7B2D8B" stroke-width="2"/>\n        <line x1="78" y1="20" x2="78" y2="88" stroke="#7B2D8B" stroke-width="2"/>\n        <ellipse cx="42" cy="20" rx="36" ry="11" fill="rgba(123,45,139,0.15)" stroke="#7B2D8B" stroke-width="2"/>\n        <line x1="42" y1="20" x2="78" y2="20" stroke="#C62828" stroke-width="1.8"/>\n        <line x1="6" y1="54" x2="6" y2="20" stroke="#2E7D32" stroke-width="1.8" stroke-dasharray="3,2"/>\n        <text x="62" y="18" font-size="9" fill="#C62828" font-weight="bold">نق</text>\n        <text x="0" y="38" font-size="9" fill="#2E7D32" font-weight="bold">ار</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        الحجم = <strong style="color:#7B2D8B">ط×نق²×ار</strong><br/>\n        م.ج.جانبية = <strong style="color:#7B2D8B">٢ط×نق×ار</strong><br/>\n        م.ج.كلية = <strong style="color:#7B2D8B">٢ط×نق(نق+ار)</strong><br/>\n        مثال: نق=٣، ار=١٠<br/>ح = ط×٩×١٠ = <strong style="color:#E8512B">٩٠ط ✓</strong>\n      </div>\n    </div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#1565C0;margin-bottom:7px">المخروط</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="80" height="95" viewBox="0 0 80 95">\n        <ellipse cx="40" cy="80" rx="34" ry="10" fill="rgba(21,101,192,0.12)" stroke="#1565C0" stroke-width="2"/>\n        <line x1="6" y1="80" x2="40" y2="8" stroke="#1565C0" stroke-width="2"/>\n        <line x1="74" y1="80" x2="40" y2="8" stroke="#1565C0" stroke-width="2"/>\n        <polygon points="6,80 74,80 40,8" fill="rgba(21,101,192,0.08)" stroke="none"/>\n        <line x1="40" y1="8" x2="40" y2="80" stroke="#2E7D32" stroke-width="1.8" stroke-dasharray="3,2"/>\n        <line x1="40" y1="80" x2="74" y2="80" stroke="#C62828" stroke-width="1.8"/>\n        <text x="58" y="78" font-size="9" fill="#C62828" font-weight="bold">نق</text>\n        <text x="42" y="45" font-size="9" fill="#2E7D32" font-weight="bold">ار</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        الحجم = <strong style="color:#1565C0"><span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٣</span></span>×ط×نق²×ار</strong><br/>\n        مثال: نق=٣، ار=١٠<br/>ح = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٣</span></span>×ط×٩×١٠ = <strong style="color:#E8512B">٣٠ط ✓</strong>\n      </div>\n    </div>\n  </div>\n  <div class="ex" style="background:#E8F5E9">\n    <div style="font-size:13px;font-weight:800;color:#2E7D32;margin-bottom:7px">الكرة</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="80" height="80" viewBox="0 0 80 80">\n        <circle cx="40" cy="40" r="34" fill="rgba(46,125,50,0.1)" stroke="#2E7D32" stroke-width="2.5"/>\n        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="4,3"/>\n        <line x1="40" y1="40" x2="74" y2="40" stroke="#C62828" stroke-width="1.8"/>\n        <text x="58" y="37" font-size="9" fill="#C62828" font-weight="bold">نق</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        الحجم = <strong style="color:#2E7D32"><span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">٤</span><span style="font-size:13px;font-weight:900;padding:0 3px">٣</span></span>×ط×نق³</strong><br/>\n        م.السطح = <strong style="color:#2E7D32">٤×ط×نق²</strong><br/>\n        مثال: نق=٣<br/>ح = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">٤</span><span style="font-size:13px;font-weight:900;padding:0 3px">٣</span></span>×ط×٢٧ = <strong style="color:#E8512B">٣٦ط ✓</strong>\n      </div>\n    </div>\n  </div>\n</div>'}, {'l': 'المساحات الجانبية والكلية', 'b': '#F4F7F9', 'h': '<div style="background:#F4F7F9;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#00695C"><span>المساحات الجانبية والكلية</span><div class="sd"></div></div>\n  <div style="margin:0 20px 10px;background:#0D4F5C;border-radius:12px;padding:12px 15px">\n    <div style="font-size:12px;font-weight:800;color:#F5A623;margin-bottom:7px;text-align:center">جدول المساحات</div>\n    <div style="border-radius:8px;overflow:hidden">\n      <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;background:#004D40">\n        <div style="padding:7px;font-size:11px;font-weight:800;color:#F5A623;text-align:center">الشكل</div><div style="padding:7px;font-size:11px;font-weight:800;color:#F5A623;text-align:center">م.جانبية</div><div style="padding:7px;font-size:11px;font-weight:800;color:#F5A623;text-align:center">م.كلية</div>\n      </div>\n      <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;background:#E0F2F1"><div style="padding:7px;font-size:11px;font-weight:800;color:#E65100;text-align:center">مكعب</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">٤ض²</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">٦ض²</div></div><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;background:#fff"><div style="padding:7px;font-size:11px;font-weight:800;color:#1565C0;text-align:center">م.مستطيلات</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">٢ار(ط+ع)</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">٢(طع+طار+عار)</div></div><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;background:#E0F2F1"><div style="padding:7px;font-size:11px;font-weight:800;color:#7B2D8B;text-align:center">أسطوانة</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">٢طنقار</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">٢طنق(نق+ار)</div></div><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;background:#fff"><div style="padding:7px;font-size:11px;font-weight:800;color:#2E7D32;text-align:center">مخروط</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">طنق×م</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">طنق(م+نق)</div></div><div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;background:#E0F2F1"><div style="padding:7px;font-size:11px;font-weight:800;color:#C62828;text-align:center">كرة</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">—</div><div style="padding:7px;font-size:10.5px;color:#1A2533;text-align:center;line-height:1.6">٤طنق²</div></div>\n    </div>\n    <div style="font-size:10px;color:#B2EBF2;margin-top:6px;text-align:center">م = الارتفاع المائل للمخروط</div>\n  </div>\n  <div class="ex" style="background:#E0F2F1">\n    <div style="font-size:13px;font-weight:800;color:#004D40;margin-bottom:7px">أمثلة تطبيقية</div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">مكعب ض=٥: م.كلية=٦×٢٥=<strong style="color:#E8512B">١٥٠ سم² ✓</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">أسطوانة نق=٣،ار=٤: م.جانبية=٢×ط×٣×٤=<strong style="color:#E8512B">٢٤ط سم² ✓</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">أسطوانة نق=٣،ار=٤: م.كلية=٢×ط×٣×(٣+٤)=<strong style="color:#E8512B">٤٢ط سم² ✓</strong></div>\n  </div>\n</div>'}, {'l': 'نسبة تغير الحجم', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#C62828"><span>⚠️ نسبة تغير الحجم — فخ القدرات!</span><div class="sd"></div></div>\n  <div class="ex" style="background:#FFEBEE">\n    <div style="font-size:13px;font-weight:800;color:#C62828;margin-bottom:8px">إذا تغير البعد — الحجم يتغير أكثر!</div>\n    <div style="background:#0D4F5C;border-radius:8px;padding:10px;text-align:center;margin-bottom:8px">\n      <div style="font-size:13px;font-weight:900;color:#F5A623">إذا ضُوعف كل الأبعاد → الحجم × ٨</div>\n      <div style="font-size:11px;color:#B2EBF2;margin-top:3px">لأن ٢×٢×٢ = ٨</div>\n    </div>\n    <div style="display:flex;justify-content:space-between;background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:5px"><div style="font-size:13px;font-weight:900;color:#C62828">الحجم × ٢</div><div style="font-size:12px;color:#1A2533;font-weight:600">ضاعف بعداً واحداً</div></div><div style="display:flex;justify-content:space-between;background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:5px"><div style="font-size:13px;font-weight:900;color:#C62828">الحجم × ٤</div><div style="font-size:12px;color:#1A2533;font-weight:600">ضاعف بعدين</div></div><div style="display:flex;justify-content:space-between;background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:5px"><div style="font-size:13px;font-weight:900;color:#C62828">الحجم × ٨</div><div style="font-size:12px;color:#1A2533;font-weight:600">ضاعف الثلاثة</div></div><div style="display:flex;justify-content:space-between;background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:5px"><div style="font-size:13px;font-weight:900;color:#C62828">الحجم × ك³</div><div style="font-size:12px;color:#1A2533;font-weight:600">أبعاد × ك</div></div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#0D47A1;margin-bottom:7px">الدائرة والأسطوانة — نق مقابل الحجم</div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:12px;color:#1A2533;line-height:2">نق × ٢ (نفس الارتفاع) → الحجم × <strong style="color:#C62828">٤</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:12px;color:#1A2533;line-height:2">نق × ٣ → الحجم × <strong style="color:#C62828">٩</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:12px;color:#1A2533;line-height:2">نق × ك → الحجم × <strong style="color:#C62828">ك²</strong></div>\n  </div>\n  <div class="ex" style="background:#E8F5E9">\n    <div style="font-size:13px;font-weight:800;color:#1B5E20;margin-bottom:7px">مثال من القدرات</div>\n    <div style="font-size:12px;color:#1A2533;line-height:2">\n      مكعب ضلعه ٢ → حجمه = ٨<br/>\n      مكعب ضلعه ٤ (ضاعف الضلع) → حجمه = ٦٤<br/>\n      النسبة = ٦٤÷٨ = <strong style="color:#E8512B">٨ (أي ٢³) ✓</strong>\n    </div>\n  </div>\n  <div style="margin:0 20px;background:#FFF8E7;border:2px solid #F5A623;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;color:#7A4800">\n    ⚠️ خطأ شائع: ضاعف الضلع → بعض الطلاب يقولون الحجم يضاعف — لا! يتضاعف ٨ مرات\n  </div>\n</div>'}, {'l': 'مسائل متنوعة', 'b': '#F4F7F9', 'h': '<div style="background:#F4F7F9;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#1A237E"><span>مسائل متنوعة من القدرات</span><div class="sd"></div></div>\n  <div class="ex" style="background:#F3E5F5">\n    <div style="font-size:12px;font-weight:800;color:#7B2D8B;margin-bottom:6px">خزان ماء أسطواني</div>\n    <div style="font-size:12px;color:#1A2533;line-height:2.2">نق=١م، ار=٢م<br/>الحجم = ط×١×٢ = <strong style="color:#E8512B">٢ط م³ ✓</strong><br/>السعة = ٢ط × ١٠٠٠ = <strong style="color:#7B2D8B">٢٠٠٠ط لتر</strong></div>\n  </div><div class="ex" style="background:#E3F2FD">\n    <div style="font-size:12px;font-weight:800;color:#1565C0;margin-bottom:6px">كم مكعباً تملأ الصندوق؟</div>\n    <div style="font-size:12px;color:#1A2533;line-height:2.2">صندوق ١٢×٨×٦ | مكعبات ضلع ٢<br/>عدد الطبقات: ١٢÷٢=٦، ٨÷٢=٤، ٦÷٢=٣<br/>الإجمالي = ٦×٤×٣ = <strong style="color:#E8512B">٧٢ مكعباً ✓</strong></div>\n  </div><div class="ex" style="background:#FBE9E7">\n    <div style="font-size:12px;font-weight:800;color:#E65100;margin-bottom:6px">علبة كارتون للتغليف</div>\n    <div style="font-size:12px;color:#1
