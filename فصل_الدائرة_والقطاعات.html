<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>فكِّر أقل … حُلَّ أسرع | الدائرة والقطاعات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e2a38;font-family:'Tajawal',sans-serif;direction:rtl;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px;gap:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.nb{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:500px;padding:10px 16px;background:rgba(255,255,255,0.08);border-radius:50px}
.nb button{background:rgba(255,255,255,0.15);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:6px 16px;border-radius:20px;cursor:pointer}
.nb button:disabled{opacity:.3;cursor:default}
.nb span{color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;text-align:center}
.pw{width:100%;max-width:500px;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.5);animation:fadeUp .35s ease}
.pnb{text-align:center;padding:8px;font-size:11px;color:#7B8FA1}
.dots{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center;max-width:500px}
.dot{height:8px;border-radius:4px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,0.25)}
.dot.active{width:24px!important;background:#F5A623}
.sh{margin:20px 20px 11px;border-radius:10px;padding:12px 17px;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.sh span{font-size:15px;font-weight:800;color:#fff}
.sd{width:10px;height:10px;border-radius:50%;background:#F5A623;flex-shrink:0}
.ex{margin:0 20px 8px;border-radius:12px;padding:12px 14px}
.qc{margin:0 20px 8px;border-radius:12px;padding:12px 14px;border:2px solid #E0F7FA;background:#F9FFFE}
.qt{font-size:13px;font-weight:700;color:#1A2533;margin-bottom:9px;line-height:2}
.qo{display:flex;flex-direction:column;gap:5px}
.op{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:right;border:1.5px solid #E0E0E0;background:#F4F7F9;color:#1A2533;transition:all .2s}
.op.ok{background:#E8F5E9;border-color:#2E7D32;color:#1B5E20;cursor:default}
.op.no{background:#FFEBEE;border-color:#C62828;color:#B71C1C;text-decoration:line-through;cursor:default}
.qe{background:#E8F5E9;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:12px;color:#1B5E20;line-height:2;display:none}
.sb{margin-top:6px;width:100%;padding:7px;background:#E0F7FA;border:1.5px dashed #00838F;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;color:#00695C;cursor:pointer}
.sr{margin:0 20px 7px;background:rgba(255,255,255,0.1);border-radius:10px;padding:11px 15px;display:flex;align-items:center;gap:10px}
svg text{font-family:'Tajawal',sans-serif}
</style>
</head>
<body>
<div class="nb">
  <button id="bn" onclick="cp(1)">التالي ←</button>
  <span id="nl"></span>
  <button id="bp" onclick="cp(-1)">→ السابق</button>
</div>
<div class="pw" id="pw"></div>
<div class="dots" id="dots"></div>
<script>
const QD=[{c:2,e:'نق=٥: المحيط=٢×ط×٥=١٠ط ✓'},{c:0,e:'نق=٤: المساحة=ط×١٦=١٦ط ✓'},{c:3,e:'ق=١٢→نق=٦: المساحة=ط×٣٦=٣٦ط ✓'},{c:1,e:'θ=٩٠°: مساحة=(٩٠÷٣٦٠)×ط×٦٤=١٦ط ✓'},{c:2,e:'θ=٩٠°: قوس=(٩٠÷٣٦٠)×٢×ط×٨=٤ط ✓'},{c:0,e:'الزاوية المحيطية=نصف المركزية=٦٠° ✓'},{c:3,e:'الحلقة: ط(١٠٠−٢٥)=٧٥ط ✓'},{c:1,e:'دائرة داخل مربع ضلعه١٠: نق=٥ | م=١٠٠−٢٥ط ✓'},{c:2,e:'نق ضاعف→المساحة×٤ ✓'},{c:0,e:'محيط=١٤ط→نق=٧ | مساحة=٤٩ط ✓'},];
function rv(qi){
  let d=QD[qi];
  document.querySelectorAll('#qo'+qi+' .op').forEach((o,i)=>{
    o.classList.add(i===d.c?'ok':'no');o.onclick=null;
  });
  let e=document.getElementById('qe'+qi);
  e.innerHTML='💡 '+d.e;e.style.display='block';
  let b=document.getElementById('qb'+qi);if(b)b.style.display='none';
}
const PAGES=[{'l': 'الغلاف', 'b': '#004D40', 'h': '<div style="background:linear-gradient(160deg,#004D40,#00695C);min-height:680px;display:flex;flex-direction:column">\n  <div style="background:linear-gradient(to left,#F5A623,#E8940A);padding:11px 20px;font-size:11px;font-weight:700;color:#004D40;display:flex;justify-content:space-between">\n    <span>فكِّر أقل … حُلَّ أسرع</span><span>الهندسة — الفصل الرابع</span>\n  </div>\n  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px">\n    <svg width="150" height="150" viewBox="0 0 150 150" style="margin-bottom:14px">\n      <circle cx="75" cy="75" r="60" fill="rgba(245,166,35,0.1)" stroke="#F5A623" stroke-width="2.5"/>\n      <line x1="75" y1="75" x2="135" y2="75" stroke="#F5A623" stroke-width="2"/>\n      <line x1="15" y1="75" x2="135" y2="75" stroke="rgba(245,166,35,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>\n      <line x1="75" y1="75" x2="110" y2="25" stroke="#80CBC4" stroke-width="2"/>\n      <circle cx="75" cy="75" r="4" fill="#F5A623"/>\n      <text x="105" y="73" font-size="10" fill="#F5A623" font-weight="bold">نق</text>\n      <text x="72" y="90" font-size="10" fill="#80CBC4" font-weight="bold">نق</text>\n      <text x="70" y="140" font-size="10" fill="rgba(245,166,35,0.7)" text-anchor="middle">المحيط = ٢ط×نق</text>\n    </svg>\n    <div style="font-family:serif;font-size:34px;color:#fff;font-weight:700;text-align:center">الدائرة والقطاعات</div>\n    <div style="width:50%;height:2px;background:linear-gradient(to left,transparent,#F5A623,transparent);margin:16px auto"></div>\n    <div style="font-size:12.5px;color:rgba(178,235,242,0.9);text-align:center;line-height:2">محيط — مساحة — قطاع<br/><strong style="color:#F5A623">حلقة — قطعة — زوايا</strong></div>\n    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px"><div style="background:rgba(0,77,64,0.3);border:1px solid rgba(0,188,212,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#80CBC4;font-weight:600">أجزاء الدائرة</div><div style="background:rgba(0,77,64,0.3);border:1px solid rgba(0,188,212,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#80CBC4;font-weight:600">المحيط</div><div style="background:rgba(0,77,64,0.3);border:1px solid rgba(0,188,212,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#80CBC4;font-weight:600">المساحة</div><div style="background:rgba(0,77,64,0.3);border:1px solid rgba(0,188,212,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#80CBC4;font-weight:600">القطاع</div><div style="background:rgba(0,77,64,0.3);border:1px solid rgba(0,188,212,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#80CBC4;font-weight:600">الزاوية المحيطية</div><div style="background:rgba(0,77,64,0.3);border:1px solid rgba(0,188,212,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#80CBC4;font-weight:600">الحلقة</div><div style="background:rgba(0,77,64,0.3);border:1px solid rgba(0,188,212,0.4);border-radius:20px;padding:4px 12px;font-size:11px;color:#80CBC4;font-weight:600">المظللات</div>\n    </div>\n  </div>\n  <div style="background:rgba(0,0,0,0.25);padding:10px 20px;display:flex;justify-content:space-between">\n    <span style="font-size:10px;color:rgba(128,203,196,0.5)">الهندسة والقياس</span>\n    <span style="font-size:11px;font-weight:700;color:#F5A623">اختبار القدرات العامة</span>\n  </div>\n</div>'}, {'l': 'أجزاء الدائرة', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#00695C"><span>أجزاء الدائرة — بالرسم</span><div class="sd"></div></div>\n  <div class="ex" style="background:#E0F2F1">\n    <svg width="100%" height="200" viewBox="0 0 300 200">\n      <!-- الدائرة الرئيسية -->\n      <circle cx="150" cy="105" r="80" fill="rgba(0,105,92,0.06)" stroke="#00695C" stroke-width="2.5"/>\n      <!-- المركز -->\n      <circle cx="150" cy="105" r="4" fill="#E8512B"/>\n      <text x="158" y="109" font-size="11" fill="#E8512B" font-weight="bold">مركز</text>\n      <!-- نصف القطر -->\n      <line x1="150" y1="105" x2="230" y2="105" stroke="#1565C0" stroke-width="2.5"/>\n      <text x="185" y="98" font-size="11" fill="#1565C0" font-weight="bold" text-anchor="middle">نصف القطر</text>\n      <!-- القطر -->\n      <line x1="70" y1="105" x2="230" y2="105" stroke="#C62828" stroke-width="1.8" stroke-dasharray="5,3"/>\n      <text x="150" y="125" font-size="11" fill="#C62828" font-weight="bold" text-anchor="middle">القطر = ٢ × نصف القطر</text>\n      <!-- الوتر -->\n      <line x1="88" y1="55" x2="212" y2="55" stroke="#7B2D8B" stroke-width="2.2"/>\n      <text x="150" y="48" font-size="11" fill="#7B2D8B" font-weight="bold" text-anchor="middle">وتر</text>\n      <!-- القوس -->\n      <path d="M230,105 A80,80 0 0,1 150,25" fill="none" stroke="#2E7D32" stroke-width="3"/>\n      <text x="218" y="58" font-size="11" fill="#2E7D32" font-weight="bold">قوس</text>\n      <!-- القطعة -->\n      <path d="M88,55 A80,80 0 0,0 212,55" fill="rgba(123,45,139,0.12)" stroke="none"/>\n      <text x="150" y="72" font-size="10" fill="#7B2D8B" font-weight="bold" text-anchor="middle">قطعة دائرية</text>\n      <!-- القطاع -->\n      <path d="M150,105 L230,105 A80,80 0 0,1 150,25 Z" fill="rgba(46,125,50,0.1)" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="3,2"/>\n      <text x="200" y="78" font-size="10" fill="#2E7D32" font-weight="bold">قطاع</text>\n    </svg>\n  </div>\n  <div style="margin:0 20px;display:flex;flex-direction:column;gap:7px"><div style="background:#E3F2FD;border-radius:9px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:12px;color:#1A2533">المسافة من المركز إلى أي نقطة على الدائرة</div><div style="font-size:12px;font-weight:800;color:#1565C0">نصف القطر</div></div><div style="background:#FFEBEE;border-radius:9px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:12px;color:#1A2533">خط يمر بالمركز طرفاه على الدائرة = ٢×نق</div><div style="font-size:12px;font-weight:800;color:#C62828">القطر</div></div><div style="background:#F3E5F5;border-radius:9px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:12px;color:#1A2533">خط يصل نقطتين على الدائرة (لا يمر بالمركز)</div><div style="font-size:12px;font-weight:800;color:#7B2D8B">الوتر</div></div><div style="background:#E8F5E9;border-radius:9px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:12px;color:#1A2533">جزء من محيط الدائرة</div><div style="font-size:12px;font-weight:800;color:#2E7D32">القوس</div></div><div style="background:#FBE9E7;border-radius:9px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center"><div style="font-size:12px;color:#1A2533">شكل كالشريحة: قوسان + ضلعان (نصف قطران)</div><div style="font-size:12px;font-weight:800;color:#E65100">القطاع</div></div>\n  </div>\n</div>'}, {'l': 'المحيط والمساحة', 'b': '#F4F7F9', 'h': '<div style="background:#F4F7F9;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#1565C0"><span>المحيط والمساحة — الفرق الواضح</span><div class="sd"></div></div>\n  <div style="margin:0 20px 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px">\n    <div style="background:#E3F2FD;border-radius:12px;padding:13px;text-align:center">\n      <div style="font-size:13px;font-weight:800;color:#1565C0;margin-bottom:8px">المحيط</div>\n      <svg width="100" height="100" viewBox="0 0 100 100">\n        <circle cx="50" cy="50" r="40" fill="none" stroke="#1565C0" stroke-width="4"/>\n        <circle cx="50" cy="50" r="3" fill="#1565C0"/>\n        <text x="50" y="96" font-size="9" fill="#1565C0" font-weight="bold" text-anchor="middle">الخط المحيط</text>\n      </svg>\n      <div style="font-size:11px;color:#7B8FA1;margin-top:4px">طول الخط المحيط</div>\n      <div style="font-size:13px;font-weight:900;color:#1565C0;margin-top:5px">ح = ٢ × ط × نق</div>\n      <div style="font-size:11px;color:#7B8FA1">أو ح = ط × ق</div>\n    </div>\n    <div style="background:#E8F5E9;border-radius:12px;padding:13px;text-align:center">\n      <div style="font-size:13px;font-weight:800;color:#2E7D32;margin-bottom:8px">المساحة</div>\n      <svg width="100" height="100" viewBox="0 0 100 100">\n        <circle cx="50" cy="50" r="40" fill="rgba(46,125,50,0.2)" stroke="#2E7D32" stroke-width="2"/>\n        <circle cx="50" cy="50" r="3" fill="#2E7D32"/>\n        <text x="50" y="55" font-size="9" fill="#2E7D32" font-weight="bold" text-anchor="middle">السطح الداخلي</text>\n      </svg>\n      <div style="font-size:11px;color:#7B8FA1;margin-top:4px">مساحة السطح الداخلي</div>\n      <div style="font-size:13px;font-weight:900;color:#2E7D32;margin-top:5px">م = ط × نق²</div>\n      <div style="font-size:11px;color:#7B8FA1">نق² يعني نق × نق</div>\n    </div>\n  </div>\n  <div style="margin:0 20px 10px;background:#0D4F5C;border-radius:12px;padding:12px 15px">\n    <div style="font-size:12px;font-weight:800;color:#F5A623;margin-bottom:7px;text-align:center">⚡ أمثلة سريعة — اترك الجواب بـ ط</div>\n    <div style="background:rgba(255,255,255,0.07);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:12px;color:#E0F7FA;line-height:2">نق=٥: المحيط=٢×ط×٥=<strong style="color:#F5A623">١٠ط</strong> | المساحة=ط×٢٥=<strong style="color:#F5A623">٢٥ط</strong></div><div style="background:rgba(255,255,255,0.07);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:12px;color:#E0F7FA;line-height:2">ق=١٢ → نق=٦: المحيط=١٢ط | المساحة=٣٦ط</div><div style="background:rgba(255,255,255,0.07);border-radius:8px;padding:8px 11px;margin-bottom:5px;font-size:12px;color:#E0F7FA;line-height:2">نق=٣: المحيط=<strong style="color:#F5A623">٦ط</strong> | المساحة=<strong style="color:#F5A623">٩ط</strong></div>\n  </div>\n  <div style="margin:0 20px;background:#FFF8E7;border:2px solid #F5A623;border-radius:10px;padding:10px 14px">\n    <div style="font-size:12.5px;font-weight:800;color:#7A4800;margin-bottom:5px">⚠️ خلط شائع في القدرات</div>\n    <div style="font-size:12px;color:#9B6000;line-height:2">المحيط = سم (وحدة طولية) ← للسياج والإطار<br/>المساحة = سم² (وحدة مربعة) ← للرسم والتغطية</div>\n  </div>\n</div>'}, {'l': 'ط (Pi)', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#E65100"><span>ط (Pi) — فكرة وتطبيق</span><div class="sd"></div></div>\n  <div class="ex" style="background:#FBE9E7">\n    <div style="font-size:13px;font-weight:800;color:#BF360C;margin-bottom:8px">ما هي ط؟</div>\n    <svg width="100%" height="90" viewBox="0 0 280 90">\n      <circle cx="50" cy="45" r="35" fill="rgba(230,81,0,0.07)" stroke="#E65100" stroke-width="2"/>\n      <line x1="15" y1="45" x2="85" y2="45" stroke="#C62828" stroke-width="2"/>\n      <text x="50" y="80" font-size="10" fill="#C62828" font-weight="bold" text-anchor="middle">القطر = ١</text>\n      <text x="110" y="35" font-size="14" fill="#E65100" font-weight="900">ط = المحيط ÷ القطر</text>\n      <text x="110" y="55" font-size="13" fill="#E8512B" font-weight="800">≈ ٣٫١٤ (دائماً)</text>\n      <text x="110" y="72" font-size="11" fill="#7B8FA1">ثابت لكل الدوائر</text>\n    </svg>\n    <div style="font-size:12px;color:#1A2533;line-height:2;margin-top:6px">\n      ط هو ثابت رياضي = نسبة محيط أي دائرة إلى قطرها<br/>\n      في القدرات: <strong style="color:#E65100">اترك الجواب بـ ط ولا تحسبه عدداً</strong>\n    </div>\n  </div>\n  <div class="ex" style="background:#E8F5E9">\n    <div style="font-size:13px;font-weight:800;color:#1B5E20;margin-bottom:7px">نسبة تغير المساحة مهمة!</div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">ضاعف نق → المحيط يضاعف | المساحة تتضاعف <strong style="color:#E8512B">٤ مرات</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">نق×٣ → المحيط×٣ | المساحة×<strong style="color:#E8512B">٩</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">نق×ك → المحيط×ك | المساحة×<strong style="color:#E8512B">ك²</strong></div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#0D47A1;margin-bottom:7px">إيجاد نق من المحيط أو المساحة</div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">\n      محيط = ١٠ط → نق = ١٠ط ÷ (٢ط) = <strong style="color:#1565C0">٥ ✓</strong>\n    </div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;font-size:12px;color:#1A2533;line-height:2">\n      مساحة = ٣٦ط → نق² = ٣٦ → نق = <span style="display:inline-block;transform:scaleX(-1)">√</span>٣٦ = <strong style="color:#1565C0">٦ ✓</strong>\n    </div>\n  </div>\n</div>'}, {'l': 'القطاع الدائري', 'b': '#F4F7F9', 'h': '<div style="background:#F4F7F9;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#7B2D8B"><span>القطاع الدائري</span><div class="sd"></div></div>\n  <div class="ex" style="background:#F3E5F5">\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="120" height="120" viewBox="0 0 120 120">\n        <circle cx="60" cy="60" r="52" fill="rgba(123,45,139,0.05)" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3,3"/>\n        <path d="M112.0,60.0 L111.9,57.3 L111.7,54.6 L111.4,51.9 L110.9,49.2 L110.2,46.5 L109.5,43.9 L108.5,41.4 L107.5,38.8 L106.3,36.4 L105.0,34.0 L103.6,31.7 L102.1,29.4 L100.4,27.3 L98.6,25.2 L96.8,23.2 L94.8,21.4 L92.7,19.6 L90.6,17.9 L88.3,16.4 L86.0,15.0 L83.6,13.7 L81.2,12.5 L78.6,11.5 L76.1,10.5 L73.5,9.8 L70.8,9.1 L68.1,8.6 L65.4,8.3 L62.7,8.1 L60.0,8.0" fill="rgba(123,45,139,0.15)" stroke="none"/>\n        <line x1="60" y1="60" x2="112" y2="60" stroke="#7B2D8B" stroke-width="2"/>\n        <line x1="60" y1="60" x2="60" y2="8" stroke="#7B2D8B" stroke-width="2"/>\n        <path d="M112.0,60.0 L111.9,57.3 L111.7,54.6 L111.4,51.9 L110.9,49.2 L110.2,46.5 L109.5,43.9 L108.5,41.4 L107.5,38.8 L106.3,36.4 L105.0,34.0 L103.6,31.7 L102.1,29.4 L100.4,27.3 L98.6,25.2 L96.8,23.2 L94.8,21.4 L92.7,19.6 L90.6,17.9 L88.3,16.4 L86.0,15.0 L83.6,13.7 L81.2,12.5 L78.6,11.5 L76.1,10.5 L73.5,9.8 L70.8,9.1 L68.1,8.6 L65.4,8.3 L62.7,8.1 L60.0,8.0" fill="none" stroke="#7B2D8B" stroke-width="2.5"/>\n        <path d="M74.0,60.0 L74.0,59.3 L73.9,58.5 L73.8,57.8 L73.7,57.1 L73.5,56.4 L73.3,55.7 L73.1,55.0 L72.8,54.3 L72.5,53.6 L72.1,53.0 L71.7,52.4 L71.3,51.8 L70.9,51.2 L70.4,50.6 L69.9,50.1 L69.4,49.6 L68.8,49.1 L68.2,48.7 L67.6,48.3 L67.0,47.9 L66.4,47.5 L65.7,47.2 L65.0,46.9 L64.3,46.7 L63.6,46.5 L62.9,46.3 L62.2,46.2 L61.5,46.1 L60.7,46.0 L60.0,46.0" fill="none" stroke="#E8512B" stroke-width="1.8"/>\n        <text x="80" y="52" font-size="10" fill="#E8512B" font-weight="bold">θ=٩٠°</text>\n        <text x="88" y="70" font-size="10" fill="#7B2D8B" font-weight="bold">نق</text>\n        <circle cx="60" cy="60" r="3.5" fill="#1A2533"/>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        <div style="font-size:13px;font-weight:800;color:#7B2D8B;margin-bottom:6px">القوانين</div>\n        مساحة = <strong style="color:#7B2D8B">(θ÷٣٦٠) × ط × نق²</strong><br/>\n        طول القوس = <strong style="color:#7B2D8B">(θ÷٣٦٠) × ٢طنق</strong><br/>\n        محيط القطاع = <strong style="color:#7B2D8B">قوس + ٢×نق</strong>\n      </div>\n    </div>\n  </div>\n  <div class="ex" style="background:#E0F2F1">\n    <div style="font-size:13px;font-weight:800;color:#004D40;margin-bottom:8px">مثال ١ — θ=٩٠°، نق=٨</div>\n    <div style="font-size:12px;color:#1A2533;line-height:2.2">\n      مساحة = (٩٠÷٣٦٠)×ط×٦٤ = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٢</span></span>×ط×٦٤ = <strong style="color:#E8512B">١٦ط سم² ✓</strong><br/>\n      قوس = (٩٠÷٣٦٠)×٢×ط×٨ = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٢</span></span>×١٦ط = <strong style="color:#E8512B">٤ط سم ✓</strong><br/>\n      محيط = ٤ط + ٢×٨ = <strong style="color:#E8512B">٤ط+١٦ سم ✓</strong>\n    </div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#0D47A1;margin-bottom:8px">مثال ٢ — θ=٦٠°، نق=١٠</div>\n    <div style="font-size:12px;color:#1A2533;line-height:2.2">\n      مساحة = (٦٠÷٣٦٠)×ط×١٠٠ = (١÷٦)×١٠٠ط = <strong style="color:#E8512B">١٠٠ط÷٦ سم²</strong><br/>\n      قوس = (٦٠÷٣٦٠)×٢×ط×١٠ = (١÷٦)×٢٠ط = <strong style="color:#E8512B">١٠ط÷٣ سم</strong>\n    </div>\n  </div>\n  <div style="margin:0 20px;background:#FFF8E7;border:2px solid #F5A623;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;color:#7A4800">\n    💡 حيلة سريعة: θ=٩٠° → ربع دائرة | θ=١٢٠° → ثلث دائرة | θ=١٨٠° → نصف دائرة\n  </div>\n</div>'}, {'l': 'الزاوية المركزية والمحيطية', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#C62828"><span>الزاوية المركزية والمحيطية ⚠️</span><div class="sd"></div></div>\n  <div style="margin:0 20px 10px;background:#FFEBEE;border-radius:12px;padding:13px 15px">\n    <div style="font-size:13px;font-weight:800;color:#C62828;margin-bottom:8px">القاعدة الذهبية</div>\n    <div style="background:#0D4F5C;border-radius:8px;padding:9px 13px;text-align:center;font-size:14px;font-weight:900;color:#F5A623;margin-bottom:8px">\n      الزاوية المحيطية = نصف الزاوية المركزية\n    </div>\n    <svg width="100%" height="140" viewBox="0 0 280 140">\n      <circle cx="140" cy="75" r="60" fill="rgba(198,40,40,0.05)" stroke="#ccc" stroke-width="1.5"/>\n      <!-- قوس -->\n      <path d="M200.0,75.0 L199.9,70.8 L199.4,66.6 L198.7,62.5 L197.7,58.5 L196.4,54.5 L194.8,50.6 L193.0,46.8 L190.9,43.2 L188.5,39.7 L186.0,36.4 L183.2,33.3 L180.1,30.4 L176.9,27.7 L173.6,25.3 L170.0,23.0 L166.3,21.1 L162.5,19.4 L158.5,17.9 L154.5,16.8 L150.4,15.9 L146.3,15.3 L142.1,15.0 L137.9,15.0 L133.7,15.3 L129.6,15.9 L125.5,16.8 L121.5,17.9 L117.5,19.4 L113.7,21.1 L110.0,23.0" fill="none" stroke="#2E7D32" stroke-width="3"/>\n      <!-- الزاوية المركزية -->\n      <line x1="140" y1="75" x2="200" y2="75" stroke="#C62828" stroke-width="2"/>\n      <line x1="140" y1="75" x2="110" y2="23" stroke="#C62828" stroke-width="2"/>\n      <path d="M158.0,75.0 L158.0,73.7 L157.8,72.5 L157.6,71.3 L157.3,70.0 L156.9,68.8 L156.4,67.7 L155.9,66.5 L155.3,65.5 L154.6,64.4 L153.8,63.4 L152.9,62.5 L152.0,61.6 L151.1,60.8 L150.1,60.1 L149.0,59.4 L147.9,58.8 L146.7,58.3 L145.6,57.9 L144.4,57.5 L143.1,57.3 L141.9,57.1 L140.6,57.0 L139.4,57.0 L138.1,57.1 L136.9,57.3 L135.6,57.5 L134.4,57.9 L133.3,58.3 L132.1,58.8 L131.0,59.4" fill="rgba(198,40,40,0.15)" stroke="#C62828" stroke-width="1.8"/>\n      <text x="164" y="70" font-size="11" fill="#C62828" font-weight="bold">١٢٠°</text>\n      <text x="128" y="94" font-size="10" fill="#C62828">مركزية</text>\n      <!-- الزاوية المحيطية -->\n      <circle cx="80" cy="118" r="3.5" fill="#1565C0"/>\n      <line x1="80" y1="118" x2="200" y2="75" stroke="#1565C0" stroke-width="1.8"/>\n      <line x1="80" y1="118" x2="110" y2="23" stroke="#1565C0" stroke-width="1.8"/>\n      <path d="M88.5,136.1 L89.1,135.8 L89.7,135.5 L90.3,135.1 L90.9,134.7 L91.5,134.3 L92.1,133.9 L92.6,133.5 L93.2,133.0 L93.7,132.6 L94.2,132.1 L94.7,131.5 L95.2,131.0 L95.6,130.5 L96.1,129.9 L96.5,129.3 L96.9,128.7 L97.2,128.1 L97.6,127.5 L97.9,126.9 L98.2,126.2 L98.5,125.6 L98.8,124.9 L99.0,124.3 L99.2,123.6 L99.4,122.9 L99.6,122.2 L99.7,121.5 L99.8,120.8 L99.9,120.1 L100.0,119.4" fill="rgba(21,101,192,0.15)" stroke="#1565C0" stroke-width="1.8"/>\n      <text x="100" y="112" font-size="11" fill="#1565C0" font-weight="bold">٦٠°</text>\n      <text x="52" y="130" font-size="10" fill="#1565C0">محيطية</text>\n      <text x="140" y="138" font-size="11" fill="#1A2533" font-weight="bold" text-anchor="middle">١٢٠° المركزية = ٢ × ٦٠° المحيطية</text>\n    </svg>\n  </div>\n  <div class="ex" style="background:#E8F5E9">\n    <div style="font-size:13px;font-weight:800;color:#1B5E20;margin-bottom:7px">أمثلة من القدرات</div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">زاوية محيطية = ٣٥° → الزاوية المركزية = <strong style="color:#E8512B">٧٠° ✓</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">زاوية مركزية = ١٠٠° → الزاوية المحيطية = <strong style="color:#E8512B">٥٠° ✓</strong></div><div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12px;color:#1A2533;line-height:2">الزاوية في نصف الدائرة (على القطر) = <strong style="color:#C62828">٩٠° دائماً</strong></div>\n  </div>\n  <div style="margin:0 20px;background:#FFF8E7;border:2px solid #F5A623;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;color:#7A4800">\n    ⚠️ فخ القدرات: كثير يخلطون بين الزاويتين — المحيطية دائماً النصف!\n  </div>\n</div>'}, {'l': 'الحلقة والمظللات', 'b': '#F4F7F9', 'h': '<div style="background:#F4F7F9;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#1565C0"><span>الحلقة الدائرية والمظللات</span><div class="sd"></div></div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#0D47A1;margin-bottom:8px">الحلقة الدائرية</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="115" height="115" viewBox="0 0 115 115">\n        <circle cx="57" cy="57" r="50" fill="rgba(21,101,192,0.15)" stroke="#1565C0" stroke-width="2.5"/>\n        <circle cx="57" cy="57" r="28" fill="#fff" stroke="#1565C0" stroke-width="2"/>\n        <line x1="57" y1="57" x2="107" y2="57" stroke="#C62828" stroke-width="1.8"/>\n        <line x1="57" y1="57" x2="85" y2="57" stroke="#2E7D32" stroke-width="1.8"/>\n        <text x="82" y="53" font-size="10" fill="#C62828" font-weight="bold">نق١=٥</text>\n        <text x="68" y="68" font-size="10" fill="#2E7D32" font-weight="bold">نق٢=٣</text>\n        <circle cx="57" cy="57" r="3.5" fill="#1A2533"/>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.3">\n        <div style="font-size:13px;font-weight:800;color:#1565C0;margin-bottom:6px">القانون</div>\n        م الحلقة = م الكبيرة − م الصغيرة<br/>\n        = ط×نق١² − ط×نق٢²<br/>\n        = <strong style="color:#1565C0">ط(نق١²−نق٢²)</strong>\n      </div>\n    </div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-top:7px;font-size:12px;color:#1A2533;line-height:2">\n      مثال: نق١=٥، نق٢=٣<br/>\n      م = ط(٢٥−٩) = <strong style="color:#E8512B">١٦ط سم² ✓</strong>\n    </div>\n  </div>\n  <div class="ex" style="background:#E8F5E9">\n    <div style="font-size:13px;font-weight:800;color:#1B5E20;margin-bottom:8px">مظللات — دائرة داخل مربع</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="110" height="110" viewBox="0 0 110 110">\n        <rect x="5" y="5" width="100" height="100" fill="rgba(46,125,50,0.15)" stroke="#2E7D32" stroke-width="2"/>\n        <circle cx="55" cy="55" r="46" fill="#fff" stroke="#2E7D32" stroke-width="2"/>\n        <text x="55" y="10" font-size="10" fill="#2E7D32" font-weight="bold" text-anchor="middle">ضلع=١٠</text>\n        <text x="78" y="58" font-size="9" fill="#2E7D32" font-weight="bold">نق=٥</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.2">\n        مربع ضلعه ١٠، بداخله دائرة نق=٥<br/>\n        المظلل = م المربع − م الدائرة<br/>\n        = ١٠² − ط×٥² = ١٠٠ − ٢٥ط<br/>\n        = <strong style="color:#E8512B">١٠٠−٢٥ط ✓</strong>\n      </div>\n    </div>\n  </div>\n  <div class="ex" style="background:#FBE9E7">\n    <div style="font-size:13px;font-weight:800;color:#BF360C;margin-bottom:7px">نصف دائرة + مستطيل (شائع في القدرات)</div>\n    <svg width="100%" height="70" viewBox="0 0 260 70">\n      <rect x="10" y="35" width="180" height="30" fill="rgba(198,40,40,0.1)" stroke="#C62828" stroke-width="2"/>\n      <path d="M190.0,35.0 L189.5,25.6 L188.0,16.3 L185.6,7.2 L182.2,-1.6 L177.9,-10.0 L172.8,-17.9 L166.9,-25.2 L160.2,-31.9 L152.9,-37.8 L145.0,-42.9 L136.6,-47.2 L127.8,-50.6 L118.7,-53.0 L109.4,-54.5 L100.0,-55.0 L90.6,-54.5 L81.3,-53.0 L72.2,-50.6 L63.4,-47.2 L55.0,-42.9 L47.1,-37.8 L39.8,-31.9 L33.1,-25.2 L27.2,-17.9 L22.1,-10.0 L17.8,-1.6 L14.4,7.2 L12.0,16.3 L10.5,25.6 L10.0,35.0" fill="rgba(198,40,40,0.1)" stroke="#C62828" stroke-width="2"/>\n      <text x="100" y="56" font-size="10" fill="#C62828" font-weight="bold" text-anchor="middle">مستطيل ١٨٠×٣٠</text>\n      <text x="100" y="18" font-size="10" fill="#C62828" font-weight="bold" text-anchor="middle">نصف دائرة نق=٩٠</text>\n    </svg>\n    <div style="font-size:12px;color:#1A2533;margin-top:5px;line-height:2">\n      الكل = مساحة المستطيل + مساحة نصف الدائرة<br/>\n      = (ط+ع) + <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٢</span></span>×ط×نق²\n    </div>\n  </div>\n</div>'}, {'l': 'القطعة الدائرية', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#2E7D32"><span>القطعة الدائرية</span><div class="sd"></div></div>\n  <div class="ex" style="background:#E8F5E9">\n    <div style="font-size:13px;font-weight:800;color:#1B5E20;margin-bottom:8px">القطعة = القطاع − المثلث</div>\n    <svg width="100%" height="130" viewBox="0 0 280 130">\n      <!-- دائرة خفيفة -->\n      <circle cx="100" cy="65" r="55" fill="none" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3,3"/>\n      <!-- القطاع -->\n      <path d="M155.0,65.0 L154.9,62.1 L154.7,59.3 L154.3,56.4 L153.8,53.6 L153.1,50.8 L152.3,48.0 L151.3,45.3 L150.2,42.6 L149.0,40.0 L147.6,37.5 L146.1,35.0 L144.5,32.7 L142.7,30.4 L140.9,28.2 L138.9,26.1 L136.8,24.1 L134.6,22.3 L132.3,20.5 L130.0,18.9 L127.5,17.4 L125.0,16.0 L122.4,14.8 L119.7,13.7 L117.0,12.7 L114.2,11.9 L111.4,11.2 L108.6,10.7 L105.7,10.3 L102.9,10.1 L100.0,10.0 L100,65 Z" fill="rgba(46,125,50,0.15)" stroke="#2E7D32" stroke-width="2"/>\n      <!-- الوتر -->\n      <line x1="100" y1="10" x2="155" y2="65" stroke="#C62828" stroke-width="2"/>\n      <!-- المثلث المحذوف -->\n      <polygon points="100,65 155,65 100,10" fill="rgba(198,40,40,0.15)" stroke="#C62828" stroke-width="1.8" stroke-dasharray="3,2"/>\n      <!-- القطعة المظللة -->\n      <path d="M155.0,65.0 L154.9,62.1 L154.7,59.3 L154.3,56.4 L153.8,53.6 L153.1,50.8 L152.3,48.0 L151.3,45.3 L150.2,42.6 L149.0,40.0 L147.6,37.5 L146.1,35.0 L144.5,32.7 L142.7,30.4 L140.9,28.2 L138.9,26.1 L136.8,24.1 L134.6,22.3 L132.3,20.5 L130.0,18.9 L127.5,17.4 L125.0,16.0 L122.4,14.8 L119.7,13.7 L117.0,12.7 L114.2,11.9 L111.4,11.2 L108.6,10.7 L105.7,10.3 L102.9,10.1 L100.0,10.0" fill="none" stroke="#2E7D32" stroke-width="2.5"/>\n      <text x="75" y="38" font-size="10" fill="#2E7D32" font-weight="bold">قطعة</text>\n      <text x="122" y="48" font-size="10" fill="#C62828" font-weight="bold">مثلث</text>\n      <!-- معادلة -->\n      <text x="185" y="50" font-size="12" fill="#1B5E20" font-weight="bold">قطعة =</text>\n      <text x="185" y="68" font-size="12" fill="#7B2D8B" font-weight="bold">قطاع −</text>\n      <text x="185" y="86" font-size="12" fill="#C62828" font-weight="bold">مثلث</text>\n    </svg>\n    <div style="font-size:12px;color:#1A2533;line-height:2;margin-top:5px">\n      م القطعة = م القطاع − م المثلث<br/>\n      = (θ÷٣٦٠)×ط×نق² − <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٢</span></span>×نق×نق×sin(θ)\n    </div>\n  </div>\n  <div class="ex" style="background:#E0F2F1">\n    <div style="font-size:13px;font-weight:800;color:#004D40;margin-bottom:7px">مثال — θ=٩٠°، نق=٦</div>\n    <div style="font-size:12px;color:#1A2533;line-height:2.2">\n      م القطاع = (٩٠÷٣٦٠)×ط×٣٦ = <strong style="color:#7B2D8B">٩ط</strong><br/>\n      م المثلث = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٢</span></span>×٦×٦ = <strong style="color:#C62828">١٨</strong> (sin90°=١)<br/>\n      م القطعة = <strong style="color:#E8512B">٩ط − ١٨ ✓</strong>\n    </div>\n  </div>\n  <div style="margin:0 20px;background:#FFF8E7;border:2px solid #F5A623;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;color:#7A4800">\n    💡 في القدرات θ=٩٠° الأكثر شيوعاً → المثلث = نصف×نق×نق = <span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle"><span style="font-size:13px;font-weight:900;padding:0 3px;border-bottom:2.5px solid currentColor">١</span><span style="font-size:13px;font-weight:900;padding:0 3px">٢</span></span>نق²\n  </div>\n</div>'}, {'l': 'الدائرة مع المضلعات', 'b': '#F4F7F9', 'h': '<div style="background:#F4F7F9;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#7B2D8B"><span>الدائرة مع المضلعات</span><div class="sd"></div></div>\n  <div class="ex" style="background:#F3E5F5">\n    <div style="font-size:13px;font-weight:800;color:#4A148C;margin-bottom:8px">دائرة محيطة بمربع</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="110" height="110" viewBox="0 0 110 110">\n        <circle cx="55" cy="55" r="45" fill="rgba(123,45,139,0.07)" stroke="#7B2D8B" stroke-width="2"/>\n        <rect x="23" y="23" width="64" height="64" fill="rgba(123,45,139,0.07)" stroke="#7B2D8B" stroke-width="2"/>\n        <line x1="23" y1="23" x2="87" y2="87" stroke="#C62828" stroke-width="1.8" stroke-dasharray="3,2"/>\n        <circle cx="55" cy="55" r="3" fill="#1A2533"/>\n        <text x="55" y="107" font-size="9" fill="#7B2D8B" font-weight="bold" text-anchor="middle">نق=ض×√٢÷٢</text>\n      </svg>\n      <div style="font-size:12px;color:#1A2533;line-height:2.2">\n        قطر الدائرة = قطر المربع<br/>\n        نق = <span style="display:inline-block;transform:scaleX(-1)">√</span>٢ × ض ÷ ٢<br/>\n        مثال: ض=٦ → نق = <strong style="color:#E8512B">٣<span style="display:inline-block;transform:scaleX(-1)">√</span>٢ ✓</strong>\n      </div>\n    </div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#0D47A1;margin-bottom:8px">دائرة داخل مربع (مماسة)</div>\n    <div style="display:flex;align-items:center;gap:14px">\n      <svg width="110" height="110" viewBox="0 0 110 110">\n        <rect x="5" y="5" width="100" height="100" fill="rgba(21,101,192,0.07)" stroke="#1565C0" stroke-width="2"/>\n        <circle cx="55" cy="55" r="49" fill="rgba(21,101,192,0.1)" stroke="#1565C0" stroke-width="2"/>\n        <line x1="55" y1="55" x2="104" y2="55" stroke="#C62828" stroke-width="1.8"/>\n        <circle cx="55" cy="55" r="3" fill="#1A2533"/>\n        <text x="80" y="50" font-si function render(){

}
