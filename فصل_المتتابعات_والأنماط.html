  return `<span class="frac" style="color:${c}"><span class="t">${t}</span><span class="b">${b}</span></span>`;

  {correct:0, explain:'أ=٢، ر=٣ | الحد الخامس = ٢ × ٣⁴ = ٢×٨١ = ١٦٢ ✓'},
  {correct:2, explain:'الفرق بين الحدود: +١، +٢، +٣، +٤ → الحد التالي = ١١+٥ = ١٦ ✓'},
  {correct:1, explain:'الدورة: ٢،٤،٦ — طولها ٣ | ١٤÷٣ = ٤ والباقي ٢ → الحد الثاني في الدورة = ٤ ✓'},
  {correct:1, explain:'٥٠÷٤ = ١٢ والباقي ٢ → الحد الثاني = ب ✓'},
  {correct:0, explain:'١،٤،٩،١٦ = مربعات → الحد التالي = ٥² = ٢٥ ✓'},
  {correct:1, explain:'م = ن÷٢ × (أ+آخر) = ١٠÷٢ × (١+١٩) = ٥×٢٠ = ١٠٠ ✓'},
  {correct:2, explain:'أ=٣، ر=٢ | ح₄ = ٣×٢^(٤−١) = ٣×٨ = ٢٤ ✓'},
];

function revealQ(qi){
  const{correct,explain}=QDATA[qi];
  document.querySelectorAll(`#q${qi}opts .q-opt`).forEach((o,i)=>{
    o.classList.add(i===correct?'correct':'wrong');
    o.onclick=null;
  });
  const exp=document.getElementById(`q${qi}exp`);
  exp.innerHTML='💡 '+explain;
  exp.style.display='block';
  const btn=document.getElementById(`q${qi}btn`);
  if(btn)btn.style.display='none';
}
function pickQ(qi){revealQ(qi)}

function initExplains(){
  QDATA.forEach((q,qi)=>{
    const el=document.getElementById('q'+qi+'exp');
    if(el) el.innerHTML='💡 '+q.explain;
  });
}
let current=0;
function render(){
  const p=PAGES[current];
  const wrap=document.getElementById('pageWrap');
  wrap.innerHTML=p.html+`<div class="page-num-bar" style="background:${p.bg}">${current+1}</div>`;
  wrap.style.animation='none';wrap.offsetHeight;wrap.style.animation='fadeUp .35s ease';
  document.getElementById('navLabel').textContent=p.label+'  '+(current+1)+'/'+PAGES.length;
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=current===PAGES.length-1;
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'');
    d.style.width=i===current?'24px':'8px';
    d.onclick=()=>{current=i;render()};
    dots.appendChild(d);
  });
  initExplains();
}
function changePage(dir){current=Math.max(0,Math.min(PAGES.length-1,current+dir));render();}
render();
</script>
