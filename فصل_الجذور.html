<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فكِّر أقل … حُلَّ أسرع | فصل الجذور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #1e2a38;
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      gap: 8px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .nav-btn:disabled {
      opacity: .3;
      cursor: default
    }

    .nav-label {
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      font-weight: 600;
      text-align: center
    }

    .page-wrap {
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      animation: fadeUp .35s ease;
    }

    .page-num-bar {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #7B8FA1;
    }

    .dots {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px
    }

    .dot {
      height: 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all .2s;
      background: rgba(255, 255, 255, 0.25)
    }

    .dot.active {
      width: 24px !important;
      background: #F5A623
    }

    .pw {
      background: #fff;
      min-height: 680px;
      padding-bottom: 28px
    }

    .pg {
      background: #F4F7F9;
      min-height: 680px;
      padding-bottom: 28px
    }

    .sec-hdr {
      margin: 24px 20px 16px;
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end
    }

    .sec-hdr-txt {
      font-size: 15px;
      font-weight: 800;
      color: #fff
    }

    .sec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #F5A623;
      flex-shrink: 0
    }

    .sum-row {
      margin: 0 20px 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      direction: rtl
    }

    .sum-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F5A623;
      flex-shrink: 0
    }

    /* كسر */
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 3px;
      line-height: 1
    }

    .frac .top {
      font-size: 13px;
      font-weight: 800;
      padding: 0 3px;
      border-bottom: 2px solid currentColor;
      line-height: 1.3
    }

    .frac .bot {
      font-size: 13px;
      font-weight: 800;
      padding: 0 3px;
      line-height: 1.3
    }

    /* الجذر — مقلوب للعربي */
    .rt {
      font-weight: 900;
      display: inline-block;
      letter-spacing: 1px;
      unicode-bidi: bidi-override;
      direction: ltr
    }

    .rt-sign {
      display: inline-block;
      transform: scaleX(-1)
    }

    /* قاعدة */
    .rule-card {
      margin: 0 20px 10px;
      border-radius: 12px;
      padding: 14px 16px
    }

    .rule-num {
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      display: inline-block;
      margin-bottom: 8px
    }

    .rule-law {
      border-radius: 8px;
      padding: 10px 14px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      margin: 8px 0;
      line-height: 2.4
    }

    .rule-ex {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      line-height: 2.6
    }

    /* quiz */
    .q-card {
      margin: 0 20px 10px;
      border-radius: 12px;
      padding: 14px 16px;
      border: 2px solid #E0F2F1;
      background: #F9FFFE
    }

    .q-text {
      font-size: 13px;
      font-weight: 700;
      color: #1A2533;
      margin-bottom: 10px;
      line-height: 2
    }

    .q-opts {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .q-opt {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: right;
      border: 1.5px solid #E0E0E0;
      background: #F4F7F9;
      color: #1A2533;
      transition: all .2s
    }

    .q-opt.correct {
      background: #E8F5E9;
      border-color: #2E7D32;
      color: #1B5E20;
      cursor: default
    }

    .q-opt.wrong {
      background: #FFEBEE;
      border-color: #C62828;
      color: #B71C1C;
      text-decoration: line-through;
      cursor: default
    }

    .q-explain {
      background: #E8F5E9;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 12px;
      color: #1B5E20;
      line-height: 2;
      display: none
    }

    .show-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: #F4F7F9;
      border: 1.5px dashed #B0BEC5;
      border-radius: 8px;
      font-family: 'Tajawal', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #7B8FA1;
      cursor: pointer
    }

    .show-btn:hover {
      background: #E0F7FA;
      border-color: #00838F;
      color: #00838F
    }
  </style>
</head>

      const btn = document.getElementById(`q${qi}btn`);

    function initExplains() {
      QDATA.forEach((q, qi) => {
        const el = document.getElementById('q' + qi + 'exp');
        if (el) el.innerHTML = '💡 ' + q.explain;
      });
    }

    let current = 0;
    function render() {
      const p = PAGES[current];
      const wrap = document.getElementById('pageWrap');
      wrap.innerHTML = p.html + `<div class="page-num-bar" style="background:${p.bg}">${current + 1}</div>`;
      wrap.style.animation = 'none'; wrap.offsetHeight; wrap.style.animation = 'fadeUp .35s ease';
      document.getElementById('navLabel').textContent = p.label + '  ' + (current + 1) + '/' + PAGES.length;
      document.getElementById('btnPrev').disabled = current === 0;
      document.getElementById('btnNext').disabled = current === PAGES.length - 1;
      const dots = document.getElementById('dots');
      dots.innerHTML = '';
      PAGES.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (i === current ? ' active' : '');
        d.style.width = i === current ? '24px' : '8px';
        d.onclick = () => { current = i; render() };
        dots.appendChild(d);
      });
      initExplains();
    }
    function changePage(dir) { current = Math.max(0, Math.min(PAGES.length - 1, current + dir)); render(); }
    render();
