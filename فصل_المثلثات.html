"20" y1="92" x2="260" y2="92" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>\n      <polygon points="20,92 115,92 115,10" fill="rgba(0,105,92,0.07)" stroke="#00695C" stroke-width="2" stroke-linejoin="round"/>\n      <polygon points="115,92 260,92 115,10" fill="rgba(0,105,92,0.07)" stroke="#00695C" stroke-width="2" stroke-linejoin="round"/>\n      <line x1="115" y1="10" x2="115" y2="92" stroke="#E8512B" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>\n      <rect x="115" y="78" width="14" height="14" fill="none" stroke="#E8512B" stroke-width="1.5"/>\n      <text x="65" y="104" font-size="11" fill="#1565C0" font-weight="bold" text-anchor="middle">م</text>\n      <text x="188" y="104" font-size="11" fill="#2E7D32" font-weight="bold" text-anchor="middle">ن</text>\n      <text x="128" y="55" font-size="11" fill="#E8512B" font-weight="bold">ع</text>\n    </svg>\n    <div style="font-size:12px;color:#1A2533;line-height:2;margin-top:4px">مثال: م=٩، ن=٤ | ع² = ٩×٤ = ٣٦ | <strong style="color:#E8512B">ع = ٦ ✓</strong></div>\n  </div>\n  <div class="ex" style="background:#E8F5E9">\n    <div style="font-size:13px;font-weight:800;color:#1B5E20;margin-bottom:7px">القطعة المتوسطة = نصف الضلع الموازي لها</div>\n    <svg width="100%" height="88" viewBox="0 0 260 88">\n      <polygon points="50,8 10,78 250,78" fill="rgba(46,125,50,0.07)" stroke="#2E7D32" stroke-width="2" stroke-linejoin="round"/>\n      <circle cx="30" cy="43" r="4" fill="#E8512B"/>\n      <circle cx="150" cy="43" r="4" fill="#E8512B"/>\n      <line x1="30" y1="43" x2="150" y2="43" stroke="#E8512B" stroke-width="2.5" stroke-linecap="round"/>\n      <text x="90" y="36" font-size="10" fill="#E8512B" font-weight="bold" text-anchor="middle">قطعة متوسطة = ٦</text>\n      <text x="130" y="92" font-size="10" fill="#2E7D32" font-weight="bold" text-anchor="middle">الضلع الموازي = ١٢</text>\n    </svg>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:7px 11px;margin-top:6px;font-size:12px;color:#1B5E20;line-height:2">\n      <strong>مثال ١:</strong> قطعة متوسطة=٩ → الضلع الموازي = ٩×٢ = <strong style="color:#E8512B">١٨ ✓</strong><br/>\n      <strong>مثال ٢:</strong> ضلع في مثلث=١٦ → القطعة المتوسطة = ١٦÷٢ = <strong style="color:#E8512B">٨ ✓</strong>\n    </div>\n  </div>\n</div>'}, {'l': 'التشابه والتطابق', 'b': '#fff', 'h': '<div style="background:#fff;min-height:680px;padding-bottom:28px">\n  <div class="sh" style="background:#1565C0"><span>التشابه والتطابق</span><div class="sd"></div></div>\n  <div style="margin:0 20px 10px;background:#0D4F5C;border-radius:12px;padding:12px 15px">\n    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">\n      <div style="background:rgba(21,101,192,0.2);border-radius:8px;padding:10px;text-align:center">\n        <div style="font-size:12px;font-weight:800;color:#B3E5FC;margin-bottom:4px">التطابق ≅</div>\n        <div style="font-size:11px;color:#B2EBF2;line-height:1.7">نفس الشكل والحجم</div>\n      </div>\n      <div style="background:rgba(46,125,50,0.2);border-radius:8px;padding:10px;text-align:center">\n        <div style="font-size:12px;font-weight:800;color:#A5D6A7;margin-bottom:4px">التشابه ~</div>\n        <div style="font-size:11px;color:#B2EBF2;line-height:1.7">نفس الشكل — أضلاع بنسبة ثابتة</div>\n      </div>\n    </div>\n  </div>\n  <div class="ex" style="background:#E3F2FD">\n    <div style="font-size:13px;font-weight:800;color:#0D47A1;margin-bottom:7px">نسبة التشابه والمساحة: نسبة التشابه=ك → المساحة=ك²</div>\n    <div style="font-size:12px;color:#1A2533;line-height:2">مثال: نسبة التشابه ١:٢ | نسبة المساحة = ١:٤ ✓</div>\n  </div>\n  <div class="ex" style="background:#FBE9E7">\n    <div style="font-size:13px;font-weight:800;color:#BF360C;margin-bottom:8px">⭐ إيجاد المجهول بالنسبة</div>\n    <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:8px 11px;margin-bottom:6px">\n      <div style="font-size:12px;font-weight:700;color:#1A2533;margin-bottom:4px">م div><div style="flex:1;text-align:right"><div style="font-size:12.5px;font-weight:800;color:#FFE0B2">الارتفاع على الوتر</div><div style="font-size:11px;color:rgba(255,220,150,0.7);margin-top:2px">ع² = م × ن</div></div></div><div class="sr"><div style="width:8px;height:8px;border-radius:50%;background:#F5A623;flex-shrink:0"></div><div style="flex:1;text-align:right"><div style="font-size:12.5px;font-weight:800;color:#FFE0B2">القطعة المتوسطة</div><div style="font-size:11px;color:rgba(255,220,150,0.7);margin-top:2px">= نصف الضلع الموازي</div></div></div><div class="sr"><div style="width:8px;height:8px;border-radius:50%;background:#F5A623;flex-shrink:0"></div><div style="flex:1;text-align:right"><div style="font-size:12.5px;font-weight:800;color:#FFE0B2">نسبة التشابه</div><div style="font-size:11px;color:rgba(255,220,150,0.7);margin-top:2px">ك → نسبة المساحة = ك²</div></div></div><div class="sr"><div style="width:8px;height:8px;border-radius:50%;background:#F5A623;flex-shrink:0"></div><div style="flex:1;text-align:right"><div style="font-size:12.5px;font-weight:800;color:#FFE0B2">مساحة المثلث</div><div style="font-size:11px;color:rgba(255,220,150,0.7);margin-top:2px">½ × القاعدة × الارتفاع</div></div></div><div class="sr"><div style="width:8px;height:8px;border-radius:50%;background:#F5A623;flex-shrink:0"></div><div style="flex:1;text-align:right"><div style="font-size:12.5px;font-weight:800;color:#FFE0B2">مساحة متساوي الأضلاع</div><div style="font-size:11px;color:rgba(255,220,150,0.7);margin-top:2px">(√٣÷٤) × ض²</div></div></div><div class="sr"><div style="width:8px;height:8px;border-radius:50%;background:#F5A623;flex-shrink:0"></div><div style="flex:1;text-align:right"><div style="font-size:12.5px;font-weight:800;color:#FFE0B2">قاعدة الأطوال</div><div style="font-size:11px;color:rgba(255,220,150,0.7);margin-top:2px">مجموع ضلعين > الضلع الثالث</div></div></div>\n  <div style="margin:10px 20px 0;background:#F5A623;border-radius:12px;padding:13px 18px;text-align:center"> let cur=0;
function render(){
  let p=PAGES[cur];
  let w=document.getElementById('pw');
  w.innerHTML=p.h+'<div class="pnb" style="background:'+p.b+'">'+( cur+1)+'</div>';
  w.style.animation='none';w.offsetHeight;w.style.animation='fadeUp .35s ease';
  document.getElementById('nl').textContent=p.l+'  '+(cur+1)+'/'+PAGES.length;
  document.getElementById('bp').disabled=cur===0;
  document.getElementById('bn').disabled=cur===PAGES.length-1;
  let dt=document.getElementById('dots');dt.innerHTML='';
  PAGES.forEach((_,i)=>{
    let d=document.createElement('div');
    d.className='dot'+(i===cur?' active':'');
    d.style.width=i===cur?'24px':'8px';
    d.onclick=()=>{cur=i;render();};
    dt.appendChild(d);
  });
}
function cp(dir){cur=Math.max(0,Math.min(PAGES.length-1,cur+dir));render();}
