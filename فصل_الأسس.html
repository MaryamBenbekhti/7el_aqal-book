// دالة رسم العدد مع أسه
function pw(base, exp, bc='#1A2533', ec='#E8512B'){
  return `<span class="pw-num"><span class="pw-base" style="color:${bc}">${base}</span><span class="pw-exp" style="color:${ec}">${exp}</span></span>`;
}
function fr(t,b,c='#1565C0'){
  return `<span class="frac" style="color:${c}"><span class="top">${t}</span><span class="bot">${b}</span></span>`;
}
// كسر صغير للأس
function frsm(t,b,c='#E8512B'){
  return `<span class="frac-sm" style="color:${c}"><span class="top">${t}</span><span class="bot">${b}</span></span>`;
}

  {correct:1, explain:'نجمع الأسس: ٣+٢=٥ ← '+pw('٢','٥')+'= ٣٢ ✓'},

  {correct:0, explain:'أي عدد ≠ ٠ مرفوع للصفر = ١ ✓'},
  {correct:3, explain:'نضرب الأسس: ٢×٣=٦ ← '+pw('٢','٦')+'= ٦٤ ✓'},
  {correct:1, explain:pw('٢','−٤')+'= ١ ÷ '+pw('٢','٤')+'= ١ ÷ ١٦ ✓'},
  {correct:1, explain:'٢٧ = '+pw('٣','٣')+' ← الجذر التكعيبي لـ ٢٧ = ٣ ✓'},
  {correct:0, explain:'نحوّل: '+pw('٤','٢')+'= ('+pw('٢','٢')+')² = '+pw('٢','٤')+' | '+pw('٢','٥')+' > '+pw('٢','٤')+' ✓'},
  {correct:1, explain:'الأساس بين ٠ و١ → الأس الأكبر = قيمة أصغر: '+pw('(½)','٣')+' < '+pw('(½)','٢')+' ✓'},
  {correct:0, explain:pw('٢','٤')+'= ١٦ | '+pw('٤','٢')+'= ١٦ ← ١٦ − ١٦ = ٠ ✓'},
  {correct:0, explain:'نضرب الأسس: ٢×٣=٦ ← '+pw('٥','٦')+' ✓'},
];

function revealQ(qi){
  const {correct,explain}=QDATA[qi];
  document.querySelectorAll('#q'+qi+'opts .q-opt').forEach((o,i)=>{
    o.classList.add(i===correct?'correct':'wrong');
    o.onclick=null;
  });
  const exp=document.getElementById('q'+qi+'exp');
  exp.innerHTML='💡 '+explain;
  exp.style.display='block';
  const btn=document.getElementById('q'+qi+'btn');
  if(btn) btn.style.display='none';
}
function pickQ(qi){revealQ(qi)}

    </div>
    <div class="rule-ex" style="color:#1B5E20">
      (${pw('٣','٢')})³ = ${pw('٣','٦')} = <strong style="color:#E8512B">٧٢٩</strong><br/>
      (${pw('٥','٢')})³ = ${pw('٥','٦')} = <strong style="color:#E8512B">١٥٦٢٥</strong>

  </div>

{label:"القواعد ٤-٦", bg:"#F4F7F9", html:`
<div class="pg">
  <div class="sec-hdr" style="background:#E8512B">
    <div class="sec-hdr-txt">قواعد خاصة مهمة</div>

  </div>

  <!-- القاعدة ٤: الأس السالب -->
  <div class="rule-card" style="background:#FBE9E7">
    <span class="rule-num" style="background:#E8512B">القاعدة ٤</span>
    <div style="font-size:13px;font-weight:800;color:#BF360C;margin-bottom:8px;text-align:right">الأس السالب → مقلوب العدد</div>
    <div class="rule-law" style="background:#E8512B;color:#fff;font-size:18px;line-height:2.2">
      أ<sup style="font-size:12px;color:#F5A623;font-weight:900">−ن</sup>
      =
      <span class="frac" style="color:#fff;font-size:14px">
        <span class="top">١</span>
        <span class="bot">أ<sup style="font-size:9px;color:#F5A623;font-weight:900">ن</sup></span>
      </span>
    </div>
    <div class="rule-ex" style="color:#BF360C;line-height:2.8">
      ٢<sup style="font-size:10px;color:#E8512B;font-weight:900">−٣</sup>
      =
      <span class="frac" style="color:#BF360C">
        <span class="top">١</span>
        <span class="bot">٢<sup style="font-size:9px;font-weight:900">٣</sup></span>
      </span>
      =
      <span class="frac" style="color:#BF360C">
        <span class="top">١</span>
        <span class="bot">٨</span>
      </span>
      &nbsp;|&nbsp;
      ٥<sup style="font-size:10px;color:#E8512B;font-weight:900">−٢</sup>
      =
      <span class="frac" style="color:#BF360C">
        <span class="top">١</span>
        <span class="bot">٢٥</span>
      </span>
    </div>
    <div style="font-size:11px;color:#E8512B;margin-top:8px;text-align:center;font-weight:700;background:rgba(232,81,43,0.1);border-radius:6px;padding:5px">⚠️ الأس السالب لا يعني أن الناتج سالب!</div>
  </div>

  <!-- القاعدة ٥: الأس الصفري -->
  <div class="rule-card" style="background:#FFF8E7">
    <span class="rule-num" style="background:#F5A623;color:#0D4F5C">القاعدة ٥</span>
    <div style="font-size:13px;font-weight:800;color:#7A4800;margin-bottom:8px;text-align:right">الأس الصفري → دائماً واحد</div>

    </div>
    <div class="rule-ex" style="color:#7A4800;line-height:2.6">
      ٧<sup style="font-size:10px;font-weight:900;color:#E8512B">٠</sup> = <strong style="color:#E8512B">١</strong>
      &nbsp;|&nbsp;
      ١٢٣<sup style="font-size:10px;font-weight:900;color:#E8512B">٠</sup> = <strong style="color:#E8512B">١</strong>
      &nbsp;|&nbsp;
      (−٥)<sup style="font-size:10px;font-weight:900;color:#E8512B">٠</sup> = <strong style="color:#E8512B">١</strong>
    </div>
  </div>

  <!-- القاعدة ٦: الأس الكسري -->
  <div class="rule-card" style="background:#E0F7FA">
    <span class="rule-num" style="background:#00838F">القاعدة ٦</span>
    <div style="font-size:13px;font-weight:800;color:#006064;margin-bottom:8px;text-align:right">الأس الكسري → جذر</div>
    <div class="rule-law" style="background:#00838F;color:#fff;line-height:2.8;text-align:center">
      <!-- أ^(١/ن) = ن√أ -->
      <span style="font-size:18px;font-weight:900">أ</span><sup style="display:inline-flex;flex-direction:column;align-items:center;font-size:8px;font-weight:900;vertical-align:super;color:#F5A623;line-height:1;margin:0 1px"><span style="border-bottom:1.5px solid #F5A623;padding:0 2px;line-height:1.4">١</span><span style="padding:0 2px;line-height:1.3">ن</span></sup>
      <span style="font-size:16px;color:#B2EBF2;margin:0 4px">=</span>
      <span class="sqrt-wrap" style="color:#F5A623">
        <span class="sqrt-index">ن</span>
        <span class="sqrt-sign">√</span>
        <span class="sqrt-body">أ</span>
      </span>
    </div>
    <div class="rule-law" style="background:#00768A;color:#fff;line-height:2.8;text-align:center;margin-top:4px">
      <!-- أ^(م/ن) = (ن√أ)^م -->
      <span style="font-size:18px;font-weight:900">أ</span><sup style="display:inline-flex;flex-direction:column;align-items:center;font-size:8px;font-weight:900;vertical-align:super;color:#F5A623;line-height:1;margin:0 1px"><span style="border-bottom:1.5px solid #F5A623;padding:0 2px;line-height:1.4">م</span><span style="padding:0 2px;line-height:1.3">ن</span></sup>
      <span style="font-size:16px;color:#B2EBF2;margin:0 4px">=</span>
      (<span class="sqrt-wrap" style="color:#F5A623">
        <span class="sqrt-index">ن</span>
        <span class="sqrt-sign">√</span>
        <span class="sqrt-body">أ</span>
      </span>)<sup style="font-size:11px;color:#F5A623;font-weight:900">م</sup>
    </div>
    <div class="rule-ex" style="color:#006064;line-height:2.8;margin-top:4px">
      <!-- ٩^(١/٢) = √٩ = ٣ -->
      <span style="font-size:16px;font-weight:900">٩</span><sup style="display:inline-flex;flex-direction:column;align-items:center;font-size:8px;font-weight:900;vertical-align:super;color:#E8512B;line-height:1;margin:0 1px"><span style="border-bottom:1.5px solid #E8512B;padding:0 2px;line-height:1.4">١</span><span style="padding:0 2px;line-height:1.3">٢</span></sup>
      =
      <span class="sqrt-wrap" style="color:#006064">
        <span class="sqrt-index" style="color:#E8512B">٢</span>
        <span class="sqrt-sign">√</span>
        <span class="sqrt-body">٩</span>
      </span>
      = <strong style="color:#E8512B;font-size:16px">٣</strong>
      <br/>
      <!-- ٨^(٢/٣) = (∛٨)² = ٤ -->
      <span style="font-size:16px;font-weight:900">٨</span><sup style="display:inline-flex;flex-direction:column;align-items:center;font-size:8px;font-weight:900;vertical-align:super;color:#E8512B;line-height:1;margin:0 1px"><span style="border-bottom:1.5px solid #E8512B;padding:0 2px;line-height:1.4">٢</span><span style="padding:0 2px;line-height:1.3">٣</span></sup>
      = (
      <span class="sqrt-wrap" style="color:#006064">
        <span class="sqrt-index" style="color:#E8512B">٣</span>
        <span class="sqrt-sign">√</span>
        <span class="sqrt-body">٨</span>
      </span>
      )<sup style="font-size:11px;color:#E8512B;font-weight:900">٢</sup>
      = ٢<sup style="font-size:11px;color:#E8512B;font-weight:900">٢</sup>
      = <strong style="color:#E8512B;font-size:16px">٤</strong>
    </div>
  </div>
</div>
`},

function initExplains(){
  QDATA.forEach((q,qi)=>{
    const el=document.getElementById('q'+qi+'exp');
    if(el) el.innerHTML='💡 '+q.explain;
  });
}

let current=0;
function render(){
  const p=PAGES[current];
  const wrap=document.getElementById('pageWrap');
  wrap.innerHTML=p.html+`<div class="page-num-bar" style="background:${p.bg}">${current+1}</div>`;
  wrap.style.animation='none';wrap.offsetHeight;wrap.style.animation='fadeUp .35s ease';
  document.getElementById('navLabel').textContent=p.label+'  '+(current+1)+'/'+PAGES.length;
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=current===PAGES.length-1;
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===current?' active':'');
    d.style.width=i===current?'24px':'8px';
    d.onclick=()=>{current=i;render()};
    dots.appendChild(d);
  });
  initExplains();
}
function changePage(dir){current=Math.max(0,Math.min(PAGES.length-1,current+dir));render();}
render();
</script>
